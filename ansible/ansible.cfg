[defaults]
inventory             = inventory/hosts.yml
roles_path            = roles
host_key_checking     = False
interpreter_python    = auto_silent
display_skipped_hosts = False
# ansible-core >= 2.13: the old `stdout_callback = yaml` plugin was removed;
# readable YAML output is now an option on the default callback.
result_format         = yaml
# Dictionary variables (aws:, infrastructure:, langfuse:, ...) merge key by
# key across sources instead of the highest-precedence source replacing the
# whole dict. That is what lets state/deploy-vars.yml (passed with -e @file)
# override a single key such as aws.target_profile or
# infrastructure.extra_tags and keep every other group_vars default, and
# lets an explicit -e '{"aws": {...}}' on the command line still win. Lists
# and scalars are unaffected. Any script that resolves these values through
# Ansible from this directory gets the same merge.
hash_behaviour        = merge

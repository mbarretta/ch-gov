---
# ClickHouse Private on AWS EKS -- deployment playbook
#
# Run from the ansible/ directory:
#   ansible-playbook deploy.yml                    # everything, Steps 1-12
#                                                  #   (+13-15 when langfuse.enabled,
#                                                  #    +16-18 when grafana.enabled,
#                                                  #    +6b/11b when sso.enabled)
#   ansible-playbook deploy.yml --tags images      # just the pull-role check, ECR setup + image sync
#   ansible-playbook deploy.yml --tags langfuse    # just the optional Steps 13-15
#   ansible-playbook deploy.yml --tags grafana     # just the optional Steps 16-18
#   ansible-playbook deploy.yml --tags sso         # just the optional Steps 6b and 11b
#   ansible-playbook deploy.yml --check            # dry run
#   ansible-playbook deploy.yml -e fips=true       # FIPS build
#
# Steps 1-12 map to the official tutorial:
#   https://clickhouse.com/docs/cloud/clickhouse-private/tutorials/deploy-aws
# Steps 13-15 are optional and off by default (langfuse.enabled in group_vars):
# a Langfuse server on the same cluster, with ClickHouse Private as its store.
# Steps 16-18 are optional and off by default (grafana.enabled in group_vars):
# a Grafana server on the same cluster, with ClickHouse Private (and, when
# enabled, Langfuse's data) as its datasource.
# Steps 6b and 11b are optional and off by default (sso.enabled in group_vars):
# an Amazon Cognito user pool for Langfuse sign-in (OIDC) and ClickHouse JWT
# sign-in. The numbering of Steps 1-18 is unchanged.

- name: ClickHouse Private -- AWS EKS
  hosts: localhost
  gather_facts: false

  # sso mode always points AWS_CONFIG_FILE at the project-local .aws/config,
  # matching scripts/env.sh and common.sh: without it, a shell that never
  # sourced env.sh would find no profiles at all. profile mode leaves
  # AWS_CONFIG_FILE alone so the caller's own file (or the AWS CLI default) is
  # used. Nothing is rendered there, so use_fips_endpoint
  # cannot arrive through a config file; the env var carries it instead.
  environment: >-
    {{ {'AWS_CONFIG_FILE': playbook_dir ~ '/../.aws/config'}
       if aws.auth_mode == 'sso'
       else ({'AWS_USE_FIPS_ENDPOINT': 'true'} if (fips | bool) else {}) }}

  pre_tasks:
    # An unknown `size` would otherwise surface as an undefined-variable error
    # deep in a role. tags: [always] so a tagged invocation cannot skip it.
    - name: Reject an unknown size
      ansible.builtin.assert:
        that: size in size_profiles
        fail_msg: >-
          size '{{ size }}' is not a known profile. Valid sizes:
          {{ size_profiles.keys() | list | sort | join(', ') }}. Set size in
          state/deploy-vars.yml or pass -e size=<name>.
        success_msg: "size '{{ size }}' is a known profile"
      tags: [always]

    # Fail before anything touches AWS if a value the customer was meant to
    # fill in is still its <...> placeholder. Only inputs this run will use
    # are checked: the SSO portal URL in sso mode, the DHI login when Grafana
    # is on. Only key names are reported -- never the values -- and assert is
    # controller-side, so this runs with no credentials and no Python
    # interpreter. It sits first so nothing is rendered from a placeholder.
    # tags: [always] so a tagged invocation cannot skip it.
    - name: Reject leftover placeholders in the deployment inputs
      vars:
        _aws_inputs: >-
          {{ {'aws.target_account_id': aws.target_account_id,
              'aws.source_ecr_account_id': aws.source_ecr_account_id}
             | combine({'aws.sso_start_url': aws.sso_start_url}
                       if aws.auth_mode == 'sso' else {}) }}
        _dhi_inputs: >-
          {{ {'dhi.username': dhi_username, 'dhi.token': dhi_token}
             if (grafana.enabled | bool) else {} }}
        _placeholder_keys: >-
          {{ (_aws_inputs | dict2items
                | selectattr('value', 'search', '<(YOUR|SOURCE_ECR)_[^<>]*>')
                | map(attribute='key') | list)
             + (_dhi_inputs | dict2items
                | selectattr('value', 'search', '<[^<>]+>')
                | map(attribute='key') | list) }}
      ansible.builtin.assert:
        that: _placeholder_keys | length == 0
        fail_msg: >-
          These settings still hold a <...> placeholder:
          {{ _placeholder_keys | join(', ') }}.
          Set real values in state/deploy-vars.yml (see
          state/deploy-vars.yml.example) and re-run.
        success_msg: "no placeholder values in the active deployment inputs"
      tags: [always]

    # auth_mode: sso only. Renders ansible/files/aws-config.ini.j2 ->
    # ../.aws/config for THIS run, honoring whatever -e fips=... was passed --
    # the authoritative render.
    # tags: [always] so a tagged invocation (e.g. --tags nodes) never skips
    # it and runs against a stale use_fips_endpoint. scripts/lib/common.sh
    # does its own credential-free render first, since scripts/play.sh and
    # scripts/part1-setup.sh check AWS auth before Ansible starts at all --
    # that one only fills in a missing file, so it never fights this one.
    - name: Create the project-local .aws directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../.aws"
        state: directory
        mode: "0700"
      when: aws.auth_mode == 'sso'
      tags: [always]

    - name: Render AWS CLI config (use_fips_endpoint tracks fips)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/aws-config.ini.j2"
        dest: "{{ playbook_dir }}/../.aws/config"
        mode: "0600"
      when: aws.auth_mode == 'sso'
      tags: [always]

    - name: Show what this run will do
      ansible.builtin.debug:
        msg:
          - "build:           {{ 'FIPS (x86_64)' if fips else 'standard (arm64)' }}"
          - "target account:  {{ aws.target_account_id }} / {{ aws.target_region }}"
          - "target registry: {{ target_registry }}"
          - "source registry: {{ source_registry }}"
          - "auth mode:       {{ aws.auth_mode }} (target profile {{ aws.target_profile }})"
          - "aws api endpoints: {{ 'FIPS-validated (use_fips_endpoint)' if fips else 'standard' }}"
          - "artifacts:       {{ all_artifacts | map(attribute='repo') | list | join(', ') }}"
      tags: [always]

  roles:
    # --- Step 1: IAM role for ECR access -----------------------------------
    # The role is arranged with ClickHouse, never created here. This step only
    # checks (read-only) that aws.source_ecr_profile really assumes
    # aws.ecr_pull_role_name in your account, before any image work starts.
    - role: ecr_pull_role
      tags: [images, ecr, pull-role]

    # --- Step 2: copy container images -------------------------------------
    - role: ecr_setup
      tags: [images, ecr]
    - role: image_sync
      tags: [images, sync]

    # --- Step 3: VPC and networking ----------------------------------------
    - role: vpc
      tags: [infra, vpc]

    # --- Step 4: EKS control plane + IRSA OIDC provider --------------------
    - role: eks_cluster
      tags: [infra, eks]

    # --- Step 5: managed node groups ---------------------------------------
    - role: eks_nodegroups
      tags: [infra, nodes]

    # --- Step 6: S3 bucket + IRSA roles ------------------------------------
    - role: storage_iam
      tags: [infra, storage]

    # --- Step 6b (optional): Cognito user pool and app clients for SSO -------
    # Role-level `when`, same shape and same reason as Langfuse's roles below:
    # nothing may change while sso.enabled is false, and the `== 'absent'` half
    # keeps the teardown reachable after the switch goes back to false.
    - role: sso_cognito
      tags: [sso, sso-idp]
      when: (sso.enabled | bool) or (sso_idp_state | default('present')) == 'absent'

    # --- Step 7: Kubernetes prerequisites ----------------------------------
    - role: k8s_prereqs
      tags: [k8s, prereqs]

    # --- Step 8: the ClickHouse operator -----------------------------------
    - role: clickhouse_operator
      tags: [k8s, operator]

    # --- Step 9: the ClickHouseCluster itself ------------------------------
    - role: clickhouse_cluster
      tags: [k8s, cluster]

    # --- Step 10: preflight checks (needs the kubectl preflight plugin) -----
    - role: clickhouse_preflight
      tags: [k8s, preflight]

    # --- Step 11: verification -- a query, and a cross-replica round trip ---
    - role: clickhouse_verify
      tags: [k8s, verify]

    # --- Step 11b (optional): ClickHouse JWT sign-in from Cognito tokens ------
    # Needs Step 6b's state files on disk and the running cluster from Step 9;
    # ordered after Step 11's verification so a broken cluster is caught first.
    - role: clickhouse_jwt
      tags: [sso, ch-jwt]
      when: >-
        ((sso.enabled | bool) and (sso.clickhouse_jwt.enabled | bool))
        or (ch_jwt_state | default('present')) == 'absent'

    # --- Step 12: load balancer (none | internal | public) -------------------
    - role: clickhouse_loadbalancer
      tags: [k8s, lb]

    # --- Steps 13-15 (optional): Langfuse on top of ClickHouse Private ---------
    # Steps 1-12 gate themselves (each role ends the play when its inputs say
    # so); these three are the first with a role-level `when`, because the
    # whole feature is a switch in group_vars and nothing about a ClickHouse-
    # only run may change while it is off. The `or ... == 'absent'` half keeps
    # the teardown reachable after the switch goes back to false: down.sh
    # removes Langfuse whenever it is actually there, and that must not depend
    # on the setting that turned it on still being set.

    # --- Step 13: Langfuse S3 bucket + IRSA role -------------------------------
    - role: langfuse_storage
      tags: [langfuse, lf-storage]
      when: (langfuse.enabled | bool) or (langfuse_storage_state | default('present')) == 'absent'

    # --- Step 14: Langfuse database and user inside ClickHouse Private ---------
    - role: langfuse_clickhouse
      tags: [langfuse, lf-db]
      when: (langfuse.enabled | bool) or (langfuse_db_state | default('present')) == 'absent'

    # --- Step 15: Langfuse itself (Helm release, NLB, PostgreSQL, Valkey) ------
    - role: langfuse
      tags: [langfuse, lf-app]
      when: (langfuse.enabled | bool) or (langfuse_state | default('present')) == 'absent'

    # --- Steps 16-18 (optional): Grafana on top of ClickHouse Private ----------
    # Ordered after Langfuse (not interleaved): a combined deployment gives
    # Grafana's read-only user access to langfuse.* for free via its blanket
    # grant, and that database must already exist. Same when: shape as
    # Langfuse's own roles above, for the same reason (teardown must stay
    # reachable after the switch goes back to false).

    # --- Step 16: Grafana S3 bucket + IRSA role, plugin mirror -----------------
    - role: grafana_storage
      tags: [grafana, gf-storage]
      when: (grafana.enabled | bool) or (grafana_storage_state | default('present')) == 'absent'

    # --- Step 17: read-only ClickHouse user for Grafana's datasource -----------
    - role: grafana_clickhouse
      tags: [grafana, gf-db]
      when: (grafana.enabled | bool) or (grafana_db_state | default('present')) == 'absent'

    # --- Step 18: Grafana itself (Helm release, NLB, initContainer, datasource) -
    - role: grafana
      tags: [grafana, gf-app]
      when: (grafana.enabled | bool) or (grafana_state | default('present')) == 'absent'

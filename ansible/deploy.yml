---
# ClickHouse Private on AWS EKS -- deployment playbook
#
# Run from the ansible/ directory:
#   ansible-playbook deploy.yml                    # everything, Steps 1-12
#                                                  #   (+13-15 when langfuse.enabled)
#   ansible-playbook deploy.yml --tags images      # just ECR setup + image sync
#   ansible-playbook deploy.yml --tags langfuse    # just the optional Steps 13-15
#   ansible-playbook deploy.yml --check            # dry run
#   ansible-playbook deploy.yml -e fips=true       # FIPS build
#
# Steps 1-12 map to the official tutorial:
#   https://clickhouse.com/docs/cloud/clickhouse-private/tutorials/deploy-aws
# Steps 13-15 are optional and off by default (langfuse.enabled in group_vars):
# a Langfuse server on the same cluster, with ClickHouse Private as its store.

- name: ClickHouse Private -- AWS EKS
  hosts: localhost
  gather_facts: false

  environment:
    # Keep AWS config project-local, matching scripts/env.sh. Without this,
    # a shell that never sourced env.sh would find no profiles at all.
    AWS_CONFIG_FILE: "{{ playbook_dir }}/../.aws/config"

  pre_tasks:
    # Renders ansible/files/aws-config.ini.j2 -> ../.aws/config for THIS run,
    # honoring whatever -e fips=... was passed -- the authoritative render.
    # tags: [always] so a tagged invocation (e.g. --tags nodes) never skips
    # it and runs against a stale use_fips_endpoint. scripts/lib/common.sh
    # does its own credential-free render first, since scripts/play.sh and
    # scripts/part1-setup.sh check AWS auth before Ansible starts at all --
    # that one only fills in a missing file, so it never fights this one.
    - name: Render AWS CLI config (use_fips_endpoint tracks fips)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/aws-config.ini.j2"
        dest: "{{ playbook_dir }}/../.aws/config"
        mode: "0600"
      tags: [always]

    - name: Show what this run will do
      ansible.builtin.debug:
        msg:
          - "build:           {{ 'FIPS (x86_64)' if fips else 'standard (arm64)' }}"
          - "target account:  {{ aws.target_account_id }} / {{ aws.target_region }}"
          - "target registry: {{ target_registry }}"
          - "source registry: {{ source_registry }}"
          - "aws api endpoints: {{ 'FIPS-validated (use_fips_endpoint)' if fips else 'standard' }}"
          - "artifacts:       {{ all_artifacts | map(attribute='repo') | list | join(', ') }}"
      tags: [always]

  roles:
    # --- Step 1: IAM role for ECR access -----------------------------------
    # Already satisfied: ClickHouseAirgapECRPullRole exists in this account
    # and the `private-us` profile assumes it. Verified by
    # scripts/part1-setup.sh. No role needed here.

    # --- Step 2: copy container images -------------------------------------
    - role: ecr_setup
      tags: [images, ecr]
    - role: image_sync
      tags: [images, sync]

    # --- Step 3: VPC and networking ----------------------------------------
    - role: vpc
      tags: [infra, vpc]

    # --- Step 4: EKS control plane + IRSA OIDC provider --------------------
    - role: eks_cluster
      tags: [infra, eks]

    # --- Step 5: managed node groups ---------------------------------------
    - role: eks_nodegroups
      tags: [infra, nodes]

    # --- Step 6: S3 bucket + IRSA roles ------------------------------------
    - role: storage_iam
      tags: [infra, storage]

    # --- Step 7: Kubernetes prerequisites ----------------------------------
    - role: k8s_prereqs
      tags: [k8s, prereqs]

    # --- Step 8: the ClickHouse operator -----------------------------------
    - role: clickhouse_operator
      tags: [k8s, operator]

    # --- Step 9: the ClickHouseCluster itself ------------------------------
    - role: clickhouse_cluster
      tags: [k8s, cluster]

    # --- Step 10: preflight checks (needs the kubectl preflight plugin) -----
    - role: clickhouse_preflight
      tags: [k8s, preflight]

    # --- Step 11: verification -- a query, and a cross-replica round trip ---
    - role: clickhouse_verify
      tags: [k8s, verify]

    # --- Step 12: load balancer (none | internal | public) -------------------
    - role: clickhouse_loadbalancer
      tags: [k8s, lb]

    # --- Steps 13-15 (optional): Langfuse on top of ClickHouse Private ---------
    # Steps 1-12 gate themselves (each role ends the play when its inputs say
    # so); these three are the first with a role-level `when`, because the
    # whole feature is a switch in group_vars and nothing about a ClickHouse-
    # only run may change while it is off. The `or ... == 'absent'` half keeps
    # the teardown reachable after the switch goes back to false: down.sh
    # removes Langfuse whenever it is actually there, and that must not depend
    # on the setting that turned it on still being set.

    # --- Step 13: Langfuse S3 bucket + IRSA role -------------------------------
    - role: langfuse_storage
      tags: [langfuse, lf-storage]
      when: (langfuse.enabled | bool) or (langfuse_storage_state | default('present')) == 'absent'

    # --- Step 14: Langfuse database and user inside ClickHouse Private ---------
    - role: langfuse_clickhouse
      tags: [langfuse, lf-db]
      when: (langfuse.enabled | bool) or (langfuse_db_state | default('present')) == 'absent'

    # --- Step 15: Langfuse itself (Helm release, NLB, PostgreSQL, Valkey) ------
    - role: langfuse
      tags: [langfuse, lf-app]
      when: (langfuse.enabled | bool) or (langfuse_state | default('present')) == 'absent'

# ===========================================================================
# ClickHouse Private on AWS EKS -- deployment configuration
#
# Versions here track the official tutorial:
#   https://clickhouse.com/docs/cloud/clickhouse-private/tutorials/deploy-aws
# scripts/part1-setup.sh prints the three most recently pushed tags for each
# source ECR repository. The optional Langfuse versions (see the langfuse: block at the end) come from
# their own public sources.
# ===========================================================================

# Ansible modules from amazon.aws / community.aws need boto3, which brew's
# Python does not have. We keep it in a project-local venv (../.venv) rather
# than mutating any system Python, so the repo stays self-contained.
# Created by scripts/part1-setup.sh.
ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python3"

# ---------------------------------------------------------------------------
# THE key switch. false = standard ARM64 build; true = FIPS x86_64 build.
# Flipping this changes image tags, the target registry hostname, node
# architecture, and (later) TLS requirements. See docs/part-1-prerequisites.md
# ---------------------------------------------------------------------------
fips: false

# ---------------------------------------------------------------------------
# Deployment size. minimal = the default: the same node types as before, with
# pod resources trimmed so the ClickHouse components stay under 74 GB of
# memory. tutorial = the upstream tutorial's node and pod sizes. The profiles
# are defined in size_profiles below.
#   size: minimal | tutorial
# Override in state/deploy-vars.yml, or per run with -e size=tutorial.
# ---------------------------------------------------------------------------
size: "minimal"

aws:
  # How this kit authenticates to AWS.
  #   sso     -- the kit renders a project-local .aws/config (SSO session plus
  #              an assume-role profile for the ECR pull) and points the AWS
  #              CLI at it. Fill in sso_start_url and the sso_* values below.
  #   profile -- you already have a working named profile (target_profile);
  #              the kit renders nothing and uses your own AWS_CONFIG_FILE or
  #              the AWS CLI default. The ECR pull profile
  #              (source_ecr_profile) must exist in that config too.
  auth_mode: "sso"

  # Your account -- where everything gets built.
  target_account_id: "<YOUR_ACCOUNT_ID>"
  target_region: "us-east-1"
  target_profile: "ch-gov-target"

  # ClickHouse's registry -- read-only, never deployed into.
  source_ecr_account_id: "<SOURCE_ECR_ACCOUNT_ID>"
  source_ecr_region: "us-east-1"
  source_ecr_profile: "ch-gov-ecr-pull"

  # The role in your account that source_ecr_profile assumes to read the
  # source registry. It is arranged with ClickHouse, not created by this kit;
  # the playbook only checks that it can be assumed.
  ecr_pull_role_name: "ClickHouseAirgapECRPullRole"
  ecr_pull_session_name: "ch-gov-ecr-pull"

  # auth_mode: sso only -- ignored in profile mode.
  # Your IAM Identity Center portal. The placeholder must be replaced before
  # `aws sso login` can work; state/deploy-vars.yml is the place for it.
  sso_start_url: "https://<YOUR_SSO_PORTAL_ID>.awsapps.com/start"
  sso_session_name: "ch-gov"
  sso_region: "{{ aws.target_region }}"
  sso_role_name: "AdministratorAccess"

  # ARN partition for this region. Derived, so it is not something to set.
  partition: "{{ 'aws-us-gov' if aws.target_region.startswith('us-gov-') else 'aws' }}"

# ---------------------------------------------------------------------------
# Infrastructure (Steps 3-5)
# ---------------------------------------------------------------------------
infrastructure:
  environment_name: "clickhouse-private"
  eks_cluster_name: "clickhouse-private-eks"
  # 1.36 is the current EKS default. 1.34 is still supported but reaches
  # end of standard support 2026-12-01. 1.36 also puts kubectl 1.37 within
  # the supported +/-1 minor skew.
  eks_version: "1.36"
  # Days CloudWatch keeps the control-plane logs (api, audit, authenticator).
  # EKS creates the log group with no expiry, and it outlives the cluster; at
  # ~0.9 GB/day of mostly audit traffic, storage would otherwise grow forever.
  # Must be a value CloudWatch accepts (1, 3, 5, 7, 14, 30, 60, 90, ...).
  eks_log_retention_days: 30

  vpc_cidr: "10.20.0.0/16"

  # Tags added to the CloudFormation stacks and S3 buckets this kit creates
  # (stack tags propagate to the resources inside), alongside its own Project
  # and ManagedBy tags, which win on a clash. Use it for the owner or
  # cost-center tags your account's policy requires, e.g.
  #   extra_tags: {Owner: platform-team, CostCenter: "1234"}
  extra_tags: {}

  # Defaults to the first three AZs (a, b, c) of target_region. In us-east-1,
  # us-east-1e is deliberately excluded: it offers none of the instance types
  # below. Subnets are AZ-pinned, so this choice is baked in at VPC creation.
  availability_zones: ["{{ aws.target_region }}a", "{{ aws.target_region }}b", "{{ aws.target_region }}c"]
  public_subnet_cidrs:  ["10.20.192.0/20", "10.20.208.0/20", "10.20.224.0/20"]
  private_subnet_cidrs: ["10.20.0.0/18", "10.20.64.0/18", "10.20.128.0/18"]

  # single = one NAT for all three AZs (~$33/mo). Egress dies if its AZ fails.
  # per_az = one per AZ (~$100/mo), which is the production/HA posture.
  nat_mode: "single"

  # Instance types differ by build, because FIPS crypto is not validated on
  # ARM64 -- the FIPS build must run x86_64 throughout. Every size-dependent
  # value below comes from the active profile (`size`, see size_profiles).
  #
  # The profiles. minimal keeps the node types this kit has always used and
  # changes only pod resources, so its instance-hour cost is unchanged.
  # tutorial is the upstream tutorial's sizing, on larger nodes.
  #
  # minimal is sized to keep the ClickHouse components' allocated memory under
  # 74 GB decimal: 3 servers x 20G + 3 keepers x 4G = 72G, which leaves under
  # 2G for the operator. Pod memory is written in decimal G, never Gi, because
  # the budget is decimal: 72Gi would be 77.3 GB. Requests equal limits
  # throughout, so the figure is what the pods can actually use.
  #
  # The onprem-clickhouse-cluster chart's own requests are 4 CPU / 8Gi per
  # server pod and 2 CPU / 4Gi per keeper pod, and a node's allocatable CPU is
  # a little under its vCPU count once kubelet reservations are taken. A
  # 6-CPU server pod needs an 8-vCPU node and a 2-CPU keeper pod needs a
  # 4-vCPU node, which is why minimal keeps m7gd.2xlarge / m7g.xlarge (or their
  # x86 equivalents).
  keeper:
    instance_type: "{{ sz.keeper_instance_type['fips' if fips else 'arm'] }}"
    node_count: 3            # always 3: Keeper needs an odd quorum
  server:
    # The trailing "d" is required, not cosmetic: it means local NVMe SSD,
    # which is where ClickHouse puts its read cache (/nvme/disk).
    instance_type: "{{ sz.server_instance_type['fips' if fips else 'arm'] }}"
    min_nodes: "{{ sz.server_min_nodes }}"   # matches the chart's server.replicaCount
    max_nodes: "{{ sz.server_max_nodes }}"
  operator:
    # x86_64 in both builds -- the tutorial specifies AL2023_x86_64 for this
    # group only. It is also the only untainted group, so cluster add-ons
    # (CoreDNS, EBS CSI controller) land here.
    instance_type: "{{ sz.operator_instance_type['fips' if fips else 'arm'] }}"
    min_nodes: "{{ sz.operator_min_nodes }}"
    max_nodes: "{{ sz.operator_max_nodes }}"
  # Root EBS per node: OS and container images only. ClickHouse data goes on
  # separate EBS volumes the Helm chart provisions.
  node_boot_disk_gb: 20

# Tags applied to every CloudFormation stack and S3 bucket: the customer's
# infrastructure.extra_tags, with this kit's own Project and ManagedBy tags
# combined last so a customer key can never override them. Defined once here
# and referenced by the roles; it is a top-level var so it resolves lazily
# against whatever infrastructure.extra_tags the merged vars hold.
stack_tags: "{{ infrastructure.extra_tags | combine({'Project': 'clickhouse-private', 'ManagedBy': 'ansible'}) }}"

# us-east-1 on-demand list prices in USD/hr, read from the AWS Pricing API.
# Used only to print an honest estimate before anything is created; a type
# missing here simply counts as 0. Refresh when AWS changes its list prices.
pricing:
  instance_hourly_usd:
    m7g.xlarge:    0.1632
    m7gd.2xlarge:  0.4271
    m7i.xlarge:    0.2016
    m6id.2xlarge:  0.4746
    m7g.2xlarge:   0.3264
    m7gd.16xlarge: 3.4171
    m7i.2xlarge:   0.4032
    m6id.16xlarge: 3.7968
  eks_control_plane_hourly_usd: 0.10
  nat_gateway_hourly_usd: 0.045
  # Langfuse (optional Steps 13-15) adds no instances: it runs on the operator
  # node group already priced above. Its own cost is a second NLB (~$0.02/hr)
  # plus pennies of EBS (two small PVCs) and S3.

# ---------------------------------------------------------------------------
# Size profiles -- the values `size` chooses between. Only size-dependent
# values live here; infrastructure.* and clickhouse.* read them through `sz`
# (see Derived values). Instance types are {arm, fips} pairs: the arm entry is
# used when fips is false, the fips entry when it is true. Pod memory is
# decimal G on purpose (see the profiles note in the infrastructure block).
#
# Operator sizing, from the pinned chart (versions.operator_chart): the
# operator Deployment runs one replica, fixed in the chart's template rather
# than a value. Of its two containers, only the operator manager takes a
# resources value; kube-rbac-proxy exposes none, so it runs unbounded and small.
# The manager is given 1G with requests equal to limits, which keeps 1 replica
# x 1G, plus the proxy's small footprint, under 2G.
# ---------------------------------------------------------------------------
size_profiles:
  minimal:
    keeper_instance_type:   {arm: "m7g.xlarge",    fips: "m7i.xlarge"}
    server_instance_type:   {arm: "m7gd.2xlarge",  fips: "m6id.2xlarge"}
    operator_instance_type: {arm: "m7i.xlarge",    fips: "m7i.xlarge"}
    server_min_nodes: 3
    server_max_nodes: 6
    operator_min_nodes: 2
    operator_max_nodes: 4
    server_cpu: "6"
    server_memory: "20G"
    keeper_cpu: "2"
    keeper_memory: "4G"
    keeper_disk: "10Gi"
    cache_disk_size: "300Gi"
    operator_cpu: "500m"
    operator_memory: "1G"
  # The upstream tutorial's sizing; same keys as minimal.
  #
  # Nodes: keepers on m7g.2xlarge (m7i.2xlarge for FIPS), servers on
  # m7gd.16xlarge (m6id.16xlarge for FIPS, the x86 NVMe type of the same 64
  # vCPU / 256GiB shape), operators on m7i.2xlarge in both builds. All four
  # types are offered in every zone of infrastructure.availability_zones.
  #
  # Hourly compute, from pricing.instance_hourly_usd, for 3 keepers + 3 servers
  # + 2 operators (control plane and NAT excluded):
  #   arm : 3 x 0.3264 + 3 x 3.4171 + 2 x 0.4032 = 12.04 USD/hr
  #   fips: 3 x 0.4032 + 3 x 3.7968 + 2 x 0.4032 = 13.41 USD/hr
  # The arm figure agrees with the roughly $12 an hour the docs quote; the
  # FIPS figure is higher because its server type costs more.
  #
  # Server pod, 60 CPU / 232Gi. A 64 vCPU / 256GiB node cannot hold a pod of
  # that full size, because kubelet keeps part of the node back. Kube-reserved
  # CPU is 6% of the first core, 1% of the second, 0.5% of each of the next
  # two and 0.25% of every core after that: 60 + 10 + 10 + 60 x 2.5 = 230m, so
  # allocatable is about 63.77 CPU. Kube-reserved memory is 255Mi + 11Mi per
  # possible pod, and this size allows up to 737 pods (15 network interfaces
  # x 49 addresses + 2), so 255 + 8107 = 8362Mi, plus the 100Mi hard eviction
  # threshold; allocatable is then 262144 - 8362 - 100 = 253682Mi, about
  # 247.7Gi. The pod takes 60 of 63.77 CPU and 232 of 247.7Gi, which leaves
  # about 3.7 CPU and 15Gi for the kube-system DaemonSets (network plugin,
  # kube-proxy, EBS CSI node) and for anything else that lands on the node.
  #
  # Keeper pod, 4 CPU / 16Gi with 50Gi of EBS, on an 8 vCPU / 32GiB node whose
  # allocatable CPU is about 7.9 (60 + 10 + 10 + 4 x 2.5 = 90m reserved).
  #
  # Read cache: the tutorial's 11Gi per Gi of RAM, so 11 x 232 = 2552Gi. The
  # two server types have the same instance store, 2 x 1900GB striped into one
  # volume: 3800GB, or about 3539Gi. 2552Gi is about 72% of it, under the 80%
  # at which the preflight check fails and with room for merge overshoot.
  #
  # Operator pins are the same as minimal: the operator is one small manager
  # container whatever the cluster size.
  tutorial:
    keeper_instance_type:   {arm: "m7g.2xlarge",   fips: "m7i.2xlarge"}
    server_instance_type:   {arm: "m7gd.16xlarge", fips: "m6id.16xlarge"}
    operator_instance_type: {arm: "m7i.2xlarge",   fips: "m7i.2xlarge"}
    server_min_nodes: 3
    server_max_nodes: 6
    operator_min_nodes: 2
    operator_max_nodes: 4
    server_cpu: "60"
    server_memory: "232Gi"
    keeper_cpu: "4"
    keeper_memory: "16Gi"
    keeper_disk: "50Gi"
    cache_disk_size: "2552Gi"
    operator_cpu: "500m"
    operator_memory: "1G"

# ---------------------------------------------------------------------------
# ClickHouse cluster identity and sizing (Steps 6-11)
# ---------------------------------------------------------------------------
clickhouse:
  # The cluster name is constrained by the chart's own schema to
  # ^[a-z]+-[a-z]{2}-[0-9]{2}$ -- e.g. default-us-01. It is not a free-form
  # label: the chart derives the service account name from it, and the IRSA
  # trust policy is bound to that exact service account.
  cluster_name: "default-us-01"
  # ns-<cluster_name>, restated literally rather than derived (a value that
  # refers back into its own mapping trips Ansible's recursion guard). The
  # ns- prefix is a convention, not decoration: the chart README recommends
  # it, the tutorial uses it, and the preflight chart assumes it by default
  # (it analyses ns-<clickhouseClusterName> unless told otherwise). Change
  # one, change the other. The IRSA trust policy (Step 6) is bound to this
  # namespace, so changing it means re-running --tags storage.
  namespace: "ns-default-us-01"
  operator_namespace: "clickhouse-operator-system"
  # The admin user the chart creates. Its password is generated on first run
  # and kept at admin_password_file (gitignored), never in group_vars.
  admin_username: "default"

  # --- pod sizing (Step 9) ---
  # These are requests AND limits (the chart sets both to the same value). All
  # values come from the active size profile (see size_profiles and the
  # profiles note in `infrastructure`), including the 74 GB memory budget and
  # why memory is decimal G. They have to fit the node types chosen there with
  # kubelet reservations taken out. The SSD cache is sized per Gi of RAM, so
  # more RAM also means a bigger cache.
  server:
    replicas: 3
    cpu: "{{ sz.server_cpu }}"
    memory: "{{ sz.server_memory }}"
    # SSD read cache on the node's local NVMe (/nvme/disk, mounted in Step 5).
    # The preflight check fails at >=80% of the disk, and ClickHouse can
    # overshoot the limit briefly during merges, so leave headroom. minimal's
    # 300Gi is ~68% of the ~442Gi on its node; tutorial's sizing is worked out
    # in size_profiles.
    cache_disk_size: "{{ sz.cache_disk_size }}"
    # The chart default is `trace`, which is a firehose. Servers here have no
    # persistent volume, so logs go to stdout and the node's container log
    # rotation -- `information` keeps that readable.
    log_level: "information"
  keeper:
    replicas: 3            # always 3: quorum
    cpu: "{{ sz.keeper_cpu }}"
    memory: "{{ sz.keeper_memory }}"
    disk: "{{ sz.keeper_disk }}"   # EBS, gp3-encrypted; Keeper's only persistent state
    log_level: "information"
  # The operator's own container (requests = limits). See the operator note in
  # size_profiles for what the chart lets us pin.
  operator:
    cpu: "{{ sz.operator_cpu }}"
    memory: "{{ sz.operator_memory }}"
  storage_class: "gp3-encrypted"

  # --- Step 12: how clients outside the cluster reach ClickHouse ---
  # The cluster chart has loadBalancer.type / .hostname values, but in this
  # deployment they are inert: the operator records them on the CR and creates
  # nothing (verified -- see Part 5). So Step 12 creates the load balancer
  # itself: a Service of type LoadBalancer that the cloud controller built
  # into the EKS control plane turns into a Network Load Balancer. No extra
  # controller, no extra images to mirror.
  load_balancer:
    # none     -> no load balancer; reach the cluster via kubectl port-forward
    #             (scripts/ch-client.sh) or from inside the cluster only.
    # internal -> NLB in the private subnets with a private address. Reachable
    #             from the VPC and anything peered/VPN'd/Direct-Connected to it.
    #             The right answer for an airgapped or regulated deployment.
    # public   -> NLB in the public subnets with a public address. Requires
    #             allowed_cidrs, and refuses 0.0.0.0/0 unless you also pass
    #             -e allow_open_internet=true. Plain TCP when fips is false,
    #             so treat "public" as a lab convenience, not a posture --
    #             fips: true moves these ports to native TLS (8443/9440);
    #             see clickhouse_loadbalancer/tasks/main.yml.
    type: "internal"
    # CIDRs allowed to connect. Becomes the Service's loadBalancerSourceRanges,
    # which the cloud controller writes into the node security group. Empty
    # means: the VPC CIDR for `internal` (the sensible default), and an error
    # for `public` (there is no sensible default).
    allowed_cidrs: []
    ports:
      - {name: http, port: 8123}      # HTTP interface: curl, JDBC/ODBC, BI tools
      - {name: native, port: 9000}    # native protocol: clickhouse-client
    # Spread traffic across all three AZs' targets regardless of which AZ the
    # request arrived in. Costs a little inter-AZ transfer; avoids a whole AZ
    # of clients pinning one replica.
    cross_zone: true

  # Derived by the chart as ch-<cluster_name>-sa. Restated here because the
  # IAM trust policy in Step 6 must name it before the chart ever runs.
  service_account: "ch-default-us-01-sa"

  # One bucket may serve several clusters, distinguished by key prefix. The
  # prefix format is enforced by the chart: ch-s3-<uuid>.
  s3_key_prefix: "ch-s3-4f6a1d2e-8b3c-4a5d-9e7f-1c2b3a4d5e6f"

  # No periods: a bucket name containing a period breaks TLS certificate
  # matching for virtual-hosted-style requests, which is also why the FIPS
  # guidance calls this out explicitly.
  bucket_name: "clickhouse-private-{{ aws.target_account_id }}-{{ aws.target_region }}"

versions:
  server: "26.2.1.525"
  keeper: "26.2.1.258"
  operator_image: "main-1.20441.1"   # container tag
  operator_chart: "1.20441.1"        # helm chart version (no "main-" prefix)
  cluster_chart: "1.8.7"
  preflight_chart: "1.38.4"
  # --- Langfuse (optional Steps 13-15; see the langfuse: block at the end) ---
  langfuse_chart: "2.1.0"            # helm chart from langfuse/langfuse-k8s
  langfuse_app: "4.25.0"             # web and worker image tag
  # Chainguard's free tier publishes only `latest`, so the ECR tag claims only the
  # major we verified (PG 18.6 / Valkey 9.1.2) and the sync freezes
  # whatever digest `latest` resolves to on first copy. Bump the tag to re-mirror.
  chainguard_postgres_tag: "pg18-cg"        # source cgr.dev/chainguard/postgres:latest
  chainguard_valkey_tag:   "valkey9-cg-dev" # source cgr.dev/chainguard/valkey:latest-dev (needs the shell)
  # --- Grafana (optional Steps 16-18; see the grafana: block at the end) ---
  # grafana_app/awscli_app are DHI catalog tags (dhi.io/grafana, dhi.io/awscli).
  # DHI requires an entitled Docker Hub login (dhi_username/dhi_token below)
  # to even resolve tags, so these pins follow the public grafana/grafana and
  # amazon/aws-cli tags. The DHI catalog resolves them at the `--tags sync`
  # run (image_sync's dhi.io login step). Deliberately no fips_suffix on either
  # (documented gap; see the endpoint-coverage matrix above and
  # docs/part-8-grafana.md).
  grafana_chart: "10.5.15"    # helm chart from grafana.github.io/helm-charts;
                              # upstream froze this chart in favor of
                              # grafana-community/helm-charts; the kit
                              # keeps this source, which still installs
                              # cleanly.
  grafana_app: "13.2.2"       # DHI grafana image tag (the main container)
  grafana_app_dev: "13.2.2-dev" # same version, DHI's "-dev" variant -- used only by the
                              # plugin-install initContainer below, which needs a real shell
                              # for its $(cat ...) substitution feeding grafana cli's
                              # --pluginUrl; DHI's hardened "runtime" tag
                              # (grafana_app above) has no shell at all. The main container
                              # keeps the hardened runtime tag.
  awscli_app: "1.46.1-dev"    # DHI awscli image tag (initContainer) -- v1's "-dev" variant.
                              # DHI's awscli v2 catalog line ships no "-dev"/shell-having tag
                              # at all (per the DHI catalog), and this
                              # initContainer's `aws s3 presign > file` needs a shell to
                              # redirect the output. v1's `s3 presign` takes the same
                              # --region/--expires-in flags this already uses.
  # Pinned + SHA256-verified against grafana.com's plugin API:
  # https://grafana.com/api/plugins/grafana-clickhouse-datasource/versions/4.21.3/download
  grafana_clickhouse_plugin_version: "4.21.3"
  grafana_clickhouse_plugin_sha256: "ab1fb90979e5b915e797e2987e19f58a346cfc8ad3120cbbef8d0b3cc894e104"

# ---------------------------------------------------------------------------
# Derived values -- do not edit; change `fips` or `versions` instead.
# ---------------------------------------------------------------------------

# The active size profile; every size-dependent leaf in infrastructure.* and
# clickhouse.* reads from it.
sz: "{{ size_profiles[size] }}"

# Only the three CONTAINER images have -fips variants. The helm charts are
# shared between both builds, so they never take the suffix.
fips_suffix: "{{ '-fips' if fips else '' }}"

source_registry: "{{ aws.source_ecr_account_id }}.dkr.ecr.{{ aws.source_ecr_region }}.amazonaws.com"

# EKS AMI family for the keeper and server node groups. The _STANDARD suffix
# is required: the tutorial writes "AL2023_x86_64", but the real API enum is
# AL2023_x86_64_STANDARD (the other variants are _NVIDIA and _NEURON). Getting
# it wrong fails at node group creation with "AMI type ... is not valid", after
# the stack has already built the IAM role and launch templates.
node_ami_type: "{{ 'AL2023_x86_64_STANDARD' if fips else 'AL2023_ARM_64_STANDARD' }}"

# The tutorial labels ARM64 node groups `clickhouseGroup: keeper-arm64` /
# `server-arm64` and leaves the chart's nodeSelector at plain `keeper` /
# `server`, relying on a mutating webhook to append the suffix. Step 8
# disables webhooks (also per the tutorial), so nothing else appends it: with
# a bare selector the Keeper pods stay Pending. So the clickhouse_cluster role
# puts the suffix in the selector itself, from this same variable. Part 4
# explains it.
node_label_suffix: "{{ '' if fips else '-arm64' }}"

# FIPS deployments must pull over FIPS-validated endpoints, which use a
# different hostname shape entirely: <acct>.dkr-ecr-fips.<region>.on.aws
target_registry: >-
  {{ aws.target_account_id ~ '.dkr-ecr-fips.' ~ aws.target_region ~ '.on.aws'
     if fips
     else aws.target_account_id ~ '.dkr.ecr.' ~ aws.target_region ~ '.amazonaws.com' }}

# S3's FIPS endpoint hostname shape (unlike ECR's, no account id in it):
# s3-fips.<region>.amazonaws.com. Consumed by ClickHouse's own S3 disk config
# in clickhouse_cluster/tasks/main.yml -- see the endpoint-coverage matrix
# below for what this does and does not put on a FIPS path.
s3_endpoint: "https://{{ 's3-fips' if fips else 's3' }}.{{ aws.target_region }}.amazonaws.com"

# RSA key size for the ClickHouse native-TLS CA/leaf certificate
# clickhouse_cluster generates: the FIPS 140-3 floor of 3072 bits
# when fips is true, the usual 2048 otherwise. Kept alongside the other
# single-fips ternaries in this block (one flag drives every FIPS choice).
tls_rsa_bits: "{{ 3072 if fips else 2048 }}"

# ---------------------------------------------------------------------------
# FIPS AWS-API endpoint-coverage matrix (what fips: true does and does not route).
# fips: true FIPS-routes:
#   - Every AWS CLI/SDK call this repo's Ansible CONTROLLER makes under the
#     aws.target_profile and aws.source_ecr_profile profiles (STS, IAM, EKS,
#     CloudFormation, ECR's own token exchange, ...) -- via use_fips_endpoint
#     in the rendered ansible/files/aws-config.ini.j2 (both profiles set it;
#     it does not inherit through source_profile). Under aws.auth_mode:
#     profile nothing is rendered, so the play and the scripts export
#     AWS_USE_FIPS_ENDPOINT=true instead.
#   - The ECR image-pull hostname (target_registry, above -- unchanged by
#     the fips switch).
#   - ClickHouse's own in-pod S3 client, i.e. its native S3-disk storage
#     backend authenticating via its own IRSA service-account annotation --
#     via s3_endpoint, above, wired into clickhouse_cluster's Helm values.
# fips: true does NOT FIPS-route (documented gap, carried into the docs task
# and FIPS.md -- do not imply blanket coverage):
#   - Langfuse's own in-pod S3 client (its own separate IRSA role, used by
#     langfuse_storage / langfuse for its object storage) -- untouched by
#     this task; still targets the standard S3 endpoint under fips: true.
#   - Cognito (optional single sign-on, sso: below): the browser and the
#     Langfuse pods reach Cognito's hosted UI and token endpoints, and
#     ClickHouse fetches Cognito's JWKS document, over the standard Cognito
#     endpoints -- none of it is routed by this repo's use_fips_endpoint.
#   - Any other pod-side AWS SDK call this deployment makes outside the
#     controller's own .aws/config and ClickHouse's S3 disk config above.
# The controller's .aws/config is evidence only for the controller's own
# calls -- it says nothing about what a pod's AWS SDK, running under its own
# IRSA-issued credentials with its own SDK config (or none), actually routes
# through.
# ---------------------------------------------------------------------------

container_images:
  - repo: clickhouse-server
    tag: "{{ versions.server }}{{ fips_suffix }}"
  - repo: clickhouse-keeper
    tag: "{{ versions.keeper }}{{ fips_suffix }}"
  - repo: clickhouse-operator
    tag: "{{ versions.operator_image }}{{ fips_suffix }}"

# Third-party images the ClickHouse charts reference but ClickHouse does not
# publish. In an airgapped cluster these have to be mirrored too, or the pod
# that needs them sits in ImagePullBackOff. Each entry names its own source,
# unlike the ClickHouse artifacts above which all come from source_registry.
third_party_images:
  # Sidecar in front of the operator's metrics endpoint. The version is the
  # operator chart's own pin -- do not float it, the chart passes flags that
  # changed in later releases.
  - repo: kubebuilder/kube-rbac-proxy
    tag: "v0.13.0"
    source: "registry.k8s.io"

helm_charts:
  - repo: helm/clickhouse-operator-helm
    tag: "{{ versions.operator_chart }}"
  - repo: helm/onprem-clickhouse-cluster
    tag: "{{ versions.cluster_chart }}"
  - repo: helm/preflight-check
    tag: "{{ versions.preflight_chart }}"

# Langfuse (optional Steps 13-15). Mirrored only when langfuse.enabled is true;
# the switch lives in the langfuse: block at the end of this file. The Langfuse
# images pull anonymously from docker.langfuse.com. The Chainguard images are
# pulled from the floating source_tag and pushed under our own frozen tag, so
# ECR's immutable tags pin the digest (see the note in versions).
langfuse_images:
  - {repo: langfuse/langfuse,        tag: "{{ versions.langfuse_app }}", source: "docker.langfuse.com"}
  - {repo: langfuse/langfuse-worker, tag: "{{ versions.langfuse_app }}", source: "docker.langfuse.com"}
  - {repo: chainguard/postgres, tag: "{{ versions.chainguard_postgres_tag }}", source: "cgr.dev", source_tag: "latest"}
  - {repo: chainguard/valkey,   tag: "{{ versions.chainguard_valkey_tag }}",   source: "cgr.dev", source_tag: "latest-dev"}
# The Langfuse chart is published from a plain Helm HTTP repository, not an OCI
# registry, so skopeo cannot copy it. kind: helm-http routes it through
# `helm pull` + `helm push` into the same helm/ path in ECR as the other charts.
langfuse_charts:
  - {repo: helm/langfuse, tag: "{{ versions.langfuse_chart }}", source: "https://langfuse.github.io/langfuse-k8s", kind: helm-http}

# Grafana (optional Steps 16-18). Mirrored only when grafana.enabled is true.
# DHI (Docker Hardened Images) is a paid, authenticated catalog -- unlike
# Chainguard's anonymous cgr.dev pulls above, dhi.io needs a real login
# (dhi_username/dhi_token below), which image_sync performs only when one of
# these entries is actually in play.
# Single source of truth for the mirrored plugin zip's filename, derived
# from versions.grafana_clickhouse_plugin_version. grafana_storage (fetch +
# upload) and grafana (the presign initContainer) both reference this
# instead of each re-templating the literal string (a naming-convention
# change, e.g. adding a checksum suffix, then only needs editing here).
grafana_plugin_zip_name: "grafana-clickhouse-datasource-{{ versions.grafana_clickhouse_plugin_version }}.zip"

grafana_images:
  - {repo: grafana, tag: "{{ versions.grafana_app }}", source: "dhi.io"}
  - {repo: grafana, tag: "{{ versions.grafana_app_dev }}", source: "dhi.io"}
  - {repo: awscli,  tag: "{{ versions.awscli_app }}",  source: "dhi.io"}
# Same helm-http mechanism as langfuse_charts: grafana/helm-charts is a plain
# Helm HTTP repository, not an OCI registry, so skopeo cannot copy it.
grafana_charts:
  - {repo: helm/grafana, tag: "{{ versions.grafana_chart }}", source: "https://grafana.github.io/helm-charts", kind: helm-http}

# Everything that must exist in your ECR before images can be copied in.
# The Langfuse/Grafana artifacts join the list only when their switch is on.
all_artifacts: "{{ container_images + helm_charts + third_party_images
                   + (langfuse_images + langfuse_charts if (langfuse.enabled | bool) else [])
                   + (grafana_images + grafana_charts if (grafana.enabled | bool) else []) }}"

# Docker Hardened Images login (grafana.enabled only). Never hardcoded here,
# never written to group_vars or any other committed file -- this is a public
# tutorial repo. Real values belong in the gitignored state/deploy-vars.yml,
# same as the aws: block above (see its comment); dhi.username/dhi.token
# there win when set. Falls back to DHI_USERNAME/DHI_TOKEN in the environment
# for callers (CI, ad-hoc shells) that would rather not touch that file. The
# resulting skopeo login lands in the same gitignored state/ authfile below
# that every other registry already uses (image_sync handles the actual
# `skopeo login dhi.io`; this task only wires the lookup).
dhi:
  username: ""
  token: ""
dhi_username: "{{ dhi.username | default('', true) or lookup('ansible.builtin.env', 'DHI_USERNAME') }}"
dhi_token: "{{ dhi.token | default('', true) or lookup('ansible.builtin.env', 'DHI_TOKEN') }}"

# skopeo credentials are written here, not to ~/.config/containers, so the
# project stays self-contained. Gitignored -- it holds real registry tokens.
skopeo_authfile: "{{ playbook_dir }}/../state/skopeo-auth.json"

# Same reasoning as .aws/config: keep it in the project, never touch
# ~/.kube/config, which may hold clusters unrelated to this work.
kubeconfig_path: "{{ playbook_dir }}/../state/kubeconfig"

# Generated secrets and run artefacts. Gitignored as a whole directory.
state_dir: "{{ playbook_dir }}/../state"
# Created by the clickhouse_cluster role on first run (32 random characters)
# and reused thereafter, so re-runs are idempotent and the verify role can
# log in. Losing this file does not lose the cluster: the hash is in the CR,
# and a new password can be set with `helm upgrade`.
admin_password_file: "{{ state_dir }}/clickhouse-admin-password"
prometheus_password_file: "{{ state_dir }}/clickhouse-prometheus-password"
# Where the preflight role leaves its rendered spec and last report.
preflight_dir: "{{ state_dir }}/preflight"

# ClickHouse native TLS: a self-signed CA and a leaf server cert
# it signs, generated once by clickhouse_cluster when fips is true and kept
# under state/ like the other generated material above. Named after
# langfuse_state_files' tls_cert_file/tls_key_file convention below, but kept
# flat here -- like admin_password_file/prometheus_password_file above --
# since ClickHouse's own state vars are not nested under a block the way
# Langfuse's are.
clickhouse_tls_ca_cert_file: "{{ state_dir }}/clickhouse-tls-ca.pem"
clickhouse_tls_ca_key_file:  "{{ state_dir }}/clickhouse-tls-ca-key.pem"
clickhouse_tls_cert_file:    "{{ state_dir }}/clickhouse-tls-cert.pem"
clickhouse_tls_key_file:     "{{ state_dir }}/clickhouse-tls-key.pem"
# The chart's own default Secret name for server.openSSL/keeper.openSSL's
# `secret` value, confirmed by rendering the chart with `helm template`:
# "<release>-server-cert-secret". Reused
# for BOTH server.openSSL.secret and keeper.openSSL.secret below -- one CA,
# one leaf cert, one Secret -- since the chart's TLS surface is CA-chain
# verification only (no per-listener SAN/hostname field exists to force two
# separate certs), and this file does not read keeper's own default
# secret-name convention from the operator chart, so it sets the name
# explicitly for both.
clickhouse_tls_secret_name: "{{ clickhouse.cluster_name }}-server-cert-secret"

# Langfuse's generated secrets (Steps 14-15), kept under state/ exactly like the
# ClickHouse admin password above: created on first run, read back afterwards.
langfuse_state_files:
  clickhouse_password_file: "{{ state_dir }}/langfuse-clickhouse-password"
  nextauth_secret_file:     "{{ state_dir }}/langfuse-nextauth-secret"
  salt_file:                "{{ state_dir }}/langfuse-salt"
  encryption_key_file:      "{{ state_dir }}/langfuse-encryption-key"
  init_user_password_file:  "{{ state_dir }}/langfuse-admin-password"
  public_key_file:          "{{ state_dir }}/langfuse-public-key"
  secret_key_file:          "{{ state_dir }}/langfuse-secret-key"
  # The self-signed key and certificate the langfuse role generates when
  # langfuse.load_balancer.tls is true. The certificate doubles as the CA
  # file clients trust (curl --cacert). Kept on teardown like the rest.
  tls_cert_file:            "{{ state_dir }}/langfuse-tls-cert.pem"
  tls_key_file:             "{{ state_dir }}/langfuse-tls-key.pem"

# Single sign-on's state (sso_cognito, Step 6b). sso_cognito writes both files
# after it creates the Cognito user pool and app clients; the later roles and
# scripts read them from disk, never from facts set by an earlier role, so a
# single --tags run (for example --tags ch-jwt) works on its own. Both are
# gitignored under state/. outputs_file is JSON holding the pool id, issuer,
# jwks_uri, hosted-UI domain and both app client IDs; it carries no secret.
# client_secret_file holds the Cognito app client secret, mode 0600, and is
# read only by tasks that set no_log. Kept on teardown like the rest.
sso_state_files:
  outputs_file:       "{{ state_dir }}/sso-cognito-outputs.json"
  client_secret_file: "{{ state_dir }}/sso-cognito-client-secret"

# Grafana's generated secrets (Steps 16-18), kept under state/ exactly like
# Langfuse's above.
grafana_state_files:
  admin_password_file:      "{{ state_dir }}/grafana-admin-password"
  clickhouse_password_file: "{{ state_dir }}/grafana-clickhouse-password"
  # The self-signed key and certificate the grafana role generates when
  # grafana.load_balancer.tls is true, same convention as langfuse's pair.
  tls_cert_file:             "{{ state_dir }}/grafana-tls-cert.pem"
  tls_key_file:              "{{ state_dir }}/grafana-tls-key.pem"

# ---------------------------------------------------------------------------
# Single sign-on (optional Steps 6b and 11b) -- an Amazon Cognito user pool that
# signs people in to Langfuse (OIDC) and to ClickHouse Private (JWT). Off by
# default; with enabled: false nothing else in this file changes what any step
# renders and no AWS resource is created. Cognito can federate to an external
# SAML identity provider, or hold the users itself.
#
# Service connections keep password authentication: the Langfuse and Grafana
# ClickHouse users, admin and prometheus are never converted to JWT. The
# Cognito client secret lives only in state/ (see sso_state_files) and in
# Kubernetes Secrets, never in this file.
#
# Keep the whole block in step with state/deploy-vars.yml.example. Nested
# dictionaries merge key by key across sources (ansible.cfg), lists replace.
# This block sits before langfuse:, which must stay near the end of the file
# (see the warning above it).
# ---------------------------------------------------------------------------
sso:
  # The master switch. false = Steps 6b and 11b do nothing.
  enabled: false
  provider: "cognito"

  cognito:
    # The hosted-UI domain: https://<domain_prefix>.auth.<region>.amazoncognito.com
    # Must be unique within the region, lowercase letters, digits and hyphens,
    # and must not contain "aws", "amazon" or "cognito". Required when
    # sso.enabled is true.
    domain_prefix: ""
    # Optional federation. A SAML metadata URL from your identity provider;
    # empty means users are held in the Cognito pool itself.
    saml_metadata_url: ""
    # Cognito groups created in the pool. A user's group memberships travel in
    # the token, and clickhouse_jwt maps groups to ClickHouse roles.
    groups:
      - "clickhouse-readonly"
      - "clickhouse-admin"

  # --- Langfuse sign-in through Cognito (OIDC) ---
  langfuse:
    enabled: false
    # true hides the email/password form so Cognito is the only way in. Leave
    # false until you have confirmed a Cognito sign-in works.
    disable_password_login: false
    # Restrict Langfuse sign-in to these email domains. [] = no restriction.
    enforce_domains: []
    # Roles Langfuse gives a user the first time they sign in.
    default_org_role: "VIEWER"
    default_project_role: "VIEWER"

  # --- ClickHouse sign-in with a Cognito token (JWT) ---
  clickhouse_jwt:
    enabled: false
    # The ClickHouse role that bounds what a token-authenticated user can be
    # granted. Empty lets the clickhouse_jwt role use its own default name.
    permission_limit_role: ""
    # Only Cognito groups whose name starts with this prefix map to ClickHouse
    # roles.
    group_prefix: "clickhouse-"
    # Group name -> GRANT statements for that group's ClickHouse role. Write
    # each statement without a TO clause; the group's role is the grantee.
    # Empty by default: dictionaries merge across sources, so an operator
    # could not remove a default entry. Example (read-only):
    #   role_grants:
    #     clickhouse-readonly:
    #       - "GRANT SELECT ON *.*"
    role_grants: {}
    # Source networks ClickHouse accepts token logins from. Empty means the
    # VPC CIDR (infrastructure.vpc_cidr).
    networks: []

# ---------------------------------------------------------------------------
# Langfuse (optional Steps 13-15) -- an LLM tracing server that stores its
# traces in the ClickHouse Private cluster above. Off by default; with
# enabled: false nothing in Steps 1-12 changes.
#
# This block is deliberately the LAST top-level key in the file. scripts/up.sh
# and scripts/down.sh scrape this file with first-match awk on `  namespace:`
# and `    type:`, and those must keep hitting the clickhouse: block. Langfuse
# scrapes use a block-scoped form (awk '/^langfuse:/{f=1} f && ...').
# ---------------------------------------------------------------------------
langfuse:
  # The switch. false = Steps 13-15 do nothing (and their artifacts are not
  # mirrored); true = up.sh runs them after Step 12.
  enabled: false
  namespace: "langfuse"
  # The Helm release name. Step 15 passes it as the chart's fullnameOverride,
  # so the ServiceAccount, the web and worker Deployments (<release>-web,
  # <release>-worker) and their Services are named after it whatever it is,
  # and the IRSA trust policy (Step 13) is bound to that exact name.
  release: "langfuse"
  # Database and user created inside ClickHouse Private by Step 14. The user
  # holds only the grants Langfuse documents, scoped to this database.
  clickhouse_database: "langfuse"
  clickhouse_user: "langfuse"
  # Events, batch exports and media. Same naming rule as clickhouse.bucket_name
  # (no periods). Reached through IRSA on the chart's ServiceAccount; no keys.
  bucket_name: "langfuse-{{ aws.target_account_id }}-{{ aws.target_region }}"
  # NEXTAUTH_URL override. Empty derives it from the load balancer hostname
  # below (or http://localhost:3000 for type none, reached by port-forward).
  # Set it when people reach Langfuse through a name other than the NLB's.
  url: ""

  # --- how browsers and SDKs reach Langfuse ---
  # Same shape and rules as clickhouse.load_balancer (Step 12), realised as a
  # second NLB Service in front of the web pods. Plain HTTP by default; tls
  # below terminates TLS at the NLB with a self-signed certificate. No domain.
  load_balancer:
    # none | internal | public -- see clickhouse.load_balancer for what each
    # means. public requires allowed_cidrs and refuses 0.0.0.0/0 unless you
    # also pass -e allow_open_internet=true.
    type: "internal"
    # Empty means the VPC CIDR for `internal` and an error for `public`.
    allowed_cidrs: []
    # NLB listener port; the target is always the web pod's 3000. Anything
    # other than 80 (443 when tls is true) is appended to the derived
    # NEXTAUTH_URL.
    port: 80
    cross_zone: true
    # true = the NLB terminates TLS. Step 15 generates an RSA key and a
    # self-signed certificate naming the NLB hostname into state/ (see
    # langfuse_state_files), imports it into ACM and points the Service at it;
    # the API keys and the login session then cross the network encrypted.
    # Self-signed means clients must trust the certificate itself: curl
    # --cacert state/langfuse-tls-cert.pem, a browser warning to click through,
    # the SDK's CA environment variable. Set port to 443 with it, so the URL
    # stays https://<hostname> with no port. Off by default when fips is
    # false: with false nothing here changes. fips: true forces this on
    # (effectively true) whenever load_balancer.type is not none, regardless
    # of this value -- the single fips switch is meant to be the whole
    # decision. load_balancer.type: none has no NLB at all, so
    # there is nothing for either switch to terminate TLS on. See
    # docs/part-6-langfuse.md section 9. Going back to false after a TLS deploy: the clean
    # way is to tear down first (-e langfuse_state=absent) and re-run. The
    # by-hand route is removing the three aws-load-balancer-ssl-* annotations
    # from Service langfuse-lb AND switching the listener back yourself:
    #   aws elbv2 modify-listener --listener-arn <listener-arn> --protocol TCP
    # (omit --certificates and --ssl-policy; AWS removes those TLS properties
    # when the protocol changes to TCP). Both steps are needed: a plain re-run
    # keeps annotations it did not apply, and the cloud controller cannot
    # change a listener's protocol, so the listener stays TLS until you change
    # it. docs/part-6-langfuse.md section 9 has the details.
    tls: false
    # Validity of the self-signed certificate in days. It is regenerated only
    # when missing or when the NLB hostname changes, not on expiry.
    tls_cert_days: 825

  # --- pod sizing ---
  # Requests AND limits. Everything runs on the operator node group, which has
  # the headroom for these defaults.
  web:
    replicas: 1
    cpu: "2"
    memory: "4Gi"
  worker:
    replicas: 1
    cpu: "2"
    memory: "4Gi"
  # PostgreSQL and Valkey run in-cluster via the chart's bundled subcharts on
  # Chainguard images (see versions). disk is an EBS volume in
  # clickhouse.storage_class; it goes away with the namespace on teardown.
  postgres:
    disk: "20Gi"
    cpu: "500m"
    memory: "1Gi"
  valkey:
    disk: "8Gi"
    cpu: "250m"
    memory: "512Mi"

  # --- headless bootstrap ---
  # Seeds an organisation, project, user and API key pair on first boot so the
  # demo works without clicking through sign-up. The user's password and the
  # API keys are generated by Step 15 and land in state/ (see
  # langfuse_state_files), never here.
  init:
    org_id: "demo"
    org_name: "Demo"
    project_id: "demo"
    project_name: "Demo"
    user_email: "admin@example.com"
    user_name: "Admin"

  # Airgap posture: no phone-home, and no self-service sign-up on a server
  # that may sit on a public address.
  telemetry_enabled: false
  signup_disabled: true

# ---------------------------------------------------------------------------
# Grafana (optional Steps 16-18) -- a dashboard/query UI wired to ClickHouse
# Private as its datasource, via a hardened DHI image and the
# grafana-clickhouse-datasource plugin (mirrored through S3, loaded by an
# IRSA-authenticated initContainer -- see grafana_storage/tasks/main.yml and
# grafana/tasks/main.yml). Off by default; with enabled: false nothing in
# Steps 1-15 changes.
#
# This block must stay the LAST top-level key in the file -- same reason
# langfuse: had to be (see the warning comment above langfuse:): scripts/up.sh
# and scripts/down.sh do first-match awk scrapes of the clickhouse: block,
# and both langfuse: and grafana: use their own block-scoped `awk
# '/^<key>:/{f=1} f && ...'` readers instead. Nothing may be appended after
# this block.
# ---------------------------------------------------------------------------
grafana:
  # The switch. false = Steps 16-18 do nothing (and their artifacts are not
  # mirrored); true = up.sh runs them after Langfuse's Steps 13-15, so the
  # blanket ClickHouse grant below already covers langfuse.* when both
  # capabilities are on.
  enabled: false
  namespace: "grafana"
  # The Helm release name. Step 18 passes it as the chart's fullnameOverride.
  release: "grafana"
  # The read-only ClickHouse user created by Step 17. GRANT SELECT ON *.* --
  # a deliberate ease-of-use choice for demos/workshops, not least privilege;
  # it also covers langfuse.* automatically, with no separate grant.
  clickhouse_user: "grafana"
  # Holds exactly one object (the mirrored plugin zip) under plugins/. Same
  # no-periods naming rule as clickhouse.bucket_name/langfuse.bucket_name.
  # Unlike those two, this bucket IS deleted on grafana_storage_state=absent
  # (see grafana_storage's header comment) -- one re-downloadable artifact,
  # no data-loss risk.
  bucket_name: "grafana-{{ aws.target_account_id }}-{{ aws.target_region }}"
  # URL override. Empty derives it from the load balancer hostname below (or
  # http://localhost:3000 for type none, reached by port-forward).
  url: ""

  # --- how browsers reach Grafana ---
  # Same shape and rules as clickhouse.load_balancer / langfuse.load_balancer.
  load_balancer:
    type: "internal"
    allowed_cidrs: []
    port: 3000          # Grafana's own default UI port.
    cross_zone: true
    tls: false
    tls_cert_days: 825

  # --- pod sizing ---
  # Requests AND limits. Runs on the operator node group, same as Langfuse --
  # no PVC, no persistence: the datasource is config-as-code (see the chart's
  # datasources: values block in grafana/tasks/main.yml).
  pod:
    replicas: 1
    cpu: "500m"
    memory: "512Mi"

  # Airgap posture: no phone-home.
  telemetry_enabled: false

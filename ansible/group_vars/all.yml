# ===========================================================================
# ClickHouse Private on AWS EKS -- deployment configuration
#
# Versions here track the official tutorial:
#   https://clickhouse.com/docs/cloud/clickhouse-private/tutorials/deploy-aws
# All were verified present in the source ECR.
# ===========================================================================

# Ansible modules from amazon.aws / community.aws need boto3, which brew's
# Python does not have. We keep it in a project-local venv (../.venv) rather
# than mutating any system Python, so the repo stays self-contained.
# Created by scripts/part1-setup.sh.
ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python3"

# ---------------------------------------------------------------------------
# THE key switch. false = standard ARM64 build; true = FIPS x86_64 build.
# Flipping this changes image tags, the target registry hostname, node
# architecture, and (later) TLS requirements. See docs/part-1-prerequisites.md
# ---------------------------------------------------------------------------
fips: false

aws:
  # Your account -- where everything gets built.
  target_account_id: "<YOUR_ACCOUNT_ID>"
  target_region: "us-east-1"
  target_profile: "sa"
  # ClickHouse's registry -- read-only, never deployed into.
  source_ecr_account_id: "<SOURCE_ECR_ACCOUNT_ID>"
  source_ecr_region: "us-east-1"
  source_ecr_profile: "private-us"

# ---------------------------------------------------------------------------
# Infrastructure (Steps 3-5)
# ---------------------------------------------------------------------------
infrastructure:
  environment_name: "clickhouse-private"
  eks_cluster_name: "clickhouse-private-eks"
  # 1.36 is the current EKS default. 1.34 is still supported but reaches
  # end of standard support 2026-12-01. 1.36 also puts kubectl 1.37 within
  # the supported +/-1 minor skew.
  eks_version: "1.36"

  vpc_cidr: "10.20.0.0/16"

  # us-east-1e is deliberately excluded: it offers none of the instance types
  # below. Subnets are AZ-pinned, so this choice is baked in at VPC creation.
  availability_zones: ["us-east-1a", "us-east-1b", "us-east-1c"]
  public_subnet_cidrs:  ["10.20.192.0/20", "10.20.208.0/20", "10.20.224.0/20"]
  private_subnet_cidrs: ["10.20.0.0/18", "10.20.64.0/18", "10.20.128.0/18"]

  # single = one NAT for all three AZs (~$33/mo). Egress dies if its AZ fails.
  # per_az = one per AZ (~$100/mo), which is the production/HA posture.
  nat_mode: "single"

  # Instance types differ by build, because FIPS crypto is not validated on
  # ARM64 -- the FIPS build must run x86_64 throughout.
  #
  # These are LEARNING sizes, deliberately smaller than the tutorial's
  # (m7g.2xlarge / m7gd.16xlarge / m7i.2xlarge, ~$12.04/hr). They are not
  # arbitrary: the onprem-clickhouse-cluster chart requests 4 CPU / 8Gi per
  # server pod and 2 CPU / 4Gi per keeper pod, and a node's allocatable CPU
  # is a little under its vCPU count once kubelet reservations are taken.
  # So a 4-vCPU node cannot hold a 4-CPU server pod, and a 2-vCPU node
  # cannot hold a 2-CPU keeper pod -- these are the smallest types that fit.
  # Shrinking further means overriding the chart's resource requests too.
  keeper:
    instance_type: "{{ 'm7i.xlarge' if fips else 'm7g.xlarge' }}"
    node_count: 3            # always 3: Keeper needs an odd quorum
  server:
    # The trailing "d" is required, not cosmetic: it means local NVMe SSD,
    # which is where ClickHouse puts its read cache (/nvme/disk).
    instance_type: "{{ 'm6id.2xlarge' if fips else 'm7gd.2xlarge' }}"
    min_nodes: 3             # matches the chart's server.replicaCount
    max_nodes: 6
  operator:
    # x86_64 in both builds -- the tutorial specifies AL2023_x86_64 for this
    # group only. It is also the only untainted group, so cluster add-ons
    # (CoreDNS, EBS CSI controller) land here.
    instance_type: "m7i.xlarge"
    min_nodes: 2
    max_nodes: 4
  # Root EBS per node: OS and container images only. ClickHouse data goes on
  # separate EBS volumes the Helm chart provisions.
  node_boot_disk_gb: 20

# us-east-1 on-demand list prices in USD/hr, read from the AWS Pricing API on
# 2026-09-03. Used only to print an honest estimate before anything is
# created; a type missing here simply counts as 0.
pricing:
  instance_hourly_usd:
    m7g.xlarge:   0.1632
    m7gd.2xlarge: 0.4271
    m7i.xlarge:   0.2016
    m6id.2xlarge: 0.4746
  eks_control_plane_hourly_usd: 0.10
  nat_gateway_hourly_usd: 0.045

# ---------------------------------------------------------------------------
# ClickHouse cluster identity and sizing (Steps 6-11)
# ---------------------------------------------------------------------------
clickhouse:
  # The cluster name is constrained by the chart's own schema to
  # ^[a-z]+-[a-z]{2}-[0-9]{2}$ -- e.g. default-us-01. It is not a free-form
  # label: the chart derives the service account name from it, and the IRSA
  # trust policy is bound to that exact service account.
  cluster_name: "default-us-01"
  # ns-<cluster_name>, restated literally rather than derived (a value that
  # refers back into its own mapping trips Ansible's recursion guard). The
  # ns- prefix is a convention, not decoration: the chart README recommends
  # it, the tutorial uses it, and the preflight chart assumes it by default
  # (it analyses ns-<clickhouseClusterName> unless told otherwise). Change
  # one, change the other. The IRSA trust policy (Step 6) is bound to this
  # namespace, so changing it means re-running --tags storage.
  namespace: "ns-default-us-01"
  operator_namespace: "clickhouse-operator-system"
  # The admin user the chart creates. Its password is generated on first run
  # and kept at admin_password_file (gitignored), never in group_vars.
  admin_username: "default"

  # --- pod sizing (Step 9) ---
  # These are requests AND limits (the chart sets both to the same value).
  # They have to fit the node types in `infrastructure` above with kubelet
  # reservations taken out: m7gd.2xlarge is 8 vCPU / 32Gi, m7g.xlarge is
  # 4 vCPU / 16Gi. Server memory is the AWS base configuration's own 16Gi
  # rather than the chart's 8Gi default -- the node has the room, and the SSD
  # cache is sized per Gi of RAM, so more RAM also means a bigger cache.
  server:
    replicas: 3
    cpu: "4"
    memory: "16Gi"
    # SSD read cache on the node's local NVMe (/nvme/disk, mounted in Step 5).
    # The disk is ~442Gi; the preflight check fails at >=80% of it, and
    # ClickHouse can overshoot the limit briefly during merges, so leave
    # headroom. 300Gi is ~68%.
    cache_disk_size: "300Gi"
    # The chart default is `trace`, which is a firehose. Servers here have no
    # persistent volume, so logs go to stdout and the node's container log
    # rotation -- `information` keeps that readable.
    log_level: "information"
  keeper:
    replicas: 3            # always 3: quorum
    cpu: "2"
    memory: "4Gi"
    disk: "10Gi"           # EBS, gp3-encrypted; Keeper's only persistent state
    log_level: "information"
  storage_class: "gp3-encrypted"

  # Derived by the chart as ch-<cluster_name>-sa. Restated here because the
  # IAM trust policy in Step 6 must name it before the chart ever runs.
  service_account: "ch-default-us-01-sa"

  # One bucket may serve several clusters, distinguished by key prefix. The
  # prefix format is enforced by the chart: ch-s3-<uuid>.
  s3_key_prefix: "ch-s3-4f6a1d2e-8b3c-4a5d-9e7f-1c2b3a4d5e6f"

  # No periods: a bucket name containing a period breaks TLS certificate
  # matching for virtual-hosted-style requests, which is also why the FIPS
  # guidance calls this out explicitly.
  bucket_name: "clickhouse-private-{{ aws.target_account_id }}-{{ aws.target_region }}"

versions:
  server: "26.2.1.525"
  keeper: "26.2.1.258"
  operator_image: "main-1.20441.1"   # container tag
  operator_chart: "1.20441.1"        # helm chart version (no "main-" prefix)
  cluster_chart: "1.8.7"
  preflight_chart: "1.38.4"

# ---------------------------------------------------------------------------
# Derived values -- do not edit; change `fips` or `versions` instead.
# ---------------------------------------------------------------------------

# Only the three CONTAINER images have -fips variants. The helm charts are
# shared between both builds, so they never take the suffix.
fips_suffix: "{{ '-fips' if fips else '' }}"

source_registry: "{{ aws.source_ecr_account_id }}.dkr.ecr.{{ aws.source_ecr_region }}.amazonaws.com"

# EKS AMI family for the keeper and server node groups. The _STANDARD suffix
# is required: the tutorial writes "AL2023_x86_64", but the real API enum is
# AL2023_x86_64_STANDARD (the other variants are _NVIDIA and _NEURON). Getting
# it wrong fails at node group creation with "AMI type ... is not valid", after
# the stack has already built the IAM role and launch templates.
node_ami_type: "{{ 'AL2023_x86_64_STANDARD' if fips else 'AL2023_ARM_64_STANDARD' }}"

# The tutorial labels ARM64 node groups `clickhouseGroup: keeper-arm64` /
# `server-arm64` and leaves the chart's nodeSelector at plain `keeper` /
# `server`, relying on a mutating webhook to append the suffix. Step 8
# disables webhooks (also per the tutorial), and the first Step 9 run proved
# nothing else appends it: Keeper pods sat Pending with a bare selector. So
# the clickhouse_cluster role puts the suffix in the selector itself, from
# this same variable. Part 4 has the story.
node_label_suffix: "{{ '' if fips else '-arm64' }}"

# FIPS deployments must pull over FIPS-validated endpoints, which use a
# different hostname shape entirely: <acct>.dkr-ecr-fips.<region>.on.aws
target_registry: >-
  {{ aws.target_account_id ~ '.dkr-ecr-fips.' ~ aws.target_region ~ '.on.aws'
     if fips
     else aws.target_account_id ~ '.dkr.ecr.' ~ aws.target_region ~ '.amazonaws.com' }}

container_images:
  - repo: clickhouse-server
    tag: "{{ versions.server }}{{ fips_suffix }}"
  - repo: clickhouse-keeper
    tag: "{{ versions.keeper }}{{ fips_suffix }}"
  - repo: clickhouse-operator
    tag: "{{ versions.operator_image }}{{ fips_suffix }}"

# Third-party images the ClickHouse charts reference but ClickHouse does not
# publish. In an airgapped cluster these have to be mirrored too, or the pod
# that needs them sits in ImagePullBackOff. Each entry names its own source,
# unlike the ClickHouse artifacts above which all come from source_registry.
third_party_images:
  # Sidecar in front of the operator's metrics endpoint. The version is the
  # operator chart's own pin -- do not float it, the chart passes flags that
  # changed in later releases.
  - repo: kubebuilder/kube-rbac-proxy
    tag: "v0.13.0"
    source: "registry.k8s.io"

helm_charts:
  - repo: helm/clickhouse-operator-helm
    tag: "{{ versions.operator_chart }}"
  - repo: helm/onprem-clickhouse-cluster
    tag: "{{ versions.cluster_chart }}"
  - repo: helm/preflight-check
    tag: "{{ versions.preflight_chart }}"

# Everything that must exist in your ECR before images can be copied in.
all_artifacts: "{{ container_images + helm_charts + third_party_images }}"

# skopeo credentials are written here, not to ~/.config/containers, so the
# project stays self-contained. Gitignored -- it holds real registry tokens.
skopeo_authfile: "{{ playbook_dir }}/../state/skopeo-auth.json"

# Same reasoning as .aws/config: keep it in the project, never touch
# ~/.kube/config, which may hold clusters unrelated to this work.
kubeconfig_path: "{{ playbook_dir }}/../state/kubeconfig"

# Generated secrets and run artefacts. Gitignored as a whole directory.
state_dir: "{{ playbook_dir }}/../state"
# Created by the clickhouse_cluster role on first run (32 random characters)
# and reused thereafter, so re-runs are idempotent and the verify role can
# log in. Losing this file does not lose the cluster: the hash is in the CR,
# and a new password can be set with `helm upgrade`.
admin_password_file: "{{ state_dir }}/clickhouse-admin-password"
prometheus_password_file: "{{ state_dir }}/clickhouse-prometheus-password"
# Where the preflight role leaves its rendered spec and last report.
preflight_dir: "{{ state_dir }}/preflight"

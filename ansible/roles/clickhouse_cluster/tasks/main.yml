---
# Step 9: deploy a ClickHouseCluster.
#
# Everything before this was scaffolding. This role installs the
# onprem-clickhouse-cluster chart, which renders ONE Kubernetes object that
# matters -- a ClickHouseCluster custom resource -- plus the service account
# it runs as and a ResourceQuota pinning the namespace to a single cluster.
# The operator from Step 8 sees the CR and builds the Keeper StatefulSet,
# one StatefulSet per server replica, their Services and config.
#
# Cost: nothing new. The pods land on the node groups Step 5 already pays for.
# Keeper gets three small EBS volumes; servers are stateless (data in S3,
# metadata in Keeper) and get no volume at all.
#
# Teardown: ansible-playbook deploy.yml --tags cluster -e cluster_state=absent
#   Removes the release, the namespace and Keeper's volumes. The S3 data is NOT
#   touched -- scripts/s3-purge-cluster-data.sh deletes it if you mean it.
#
# The work is split across three files so the second service can reuse it:
#   release.yml  preconditions, inputs, the Helm install, the waits and the
#                image-origin and IRSA checks -- for any one release, driven
#                by the _rel dict described at its top
#   tls.yml      the fips: true native-TLS CA, leaf and Secret, imported by
#                release.yml
#   main.yml     this file: builds _rel from clickhouse.* for this cluster,
#                then the teardown and the checks only this cluster needs

- name: Install the cluster release
  ansible.builtin.import_tasks: release.yml
  vars:
    _rel:
      name: "{{ clickhouse.cluster_name }}"
      namespace: "{{ clickhouse.namespace }}"
      service_account: "{{ clickhouse.service_account }}"
      replicas: "{{ clickhouse.server.replicas }}"
      node_group: server
      keeper_replicas: "{{ clickhouse.keeper.replicas }}"
      parent: {}
      is_readonly: false

# --- teardown ---------------------------------------------------------------
# helm uninstall removes the CR; the operator then deletes the StatefulSets.
# The Keeper PVCs survive that (StatefulSet semantics), and so does the
# namespace. Removing the namespace takes the PVCs with it, and the
# StorageClass's Delete reclaim policy takes the EBS volumes. S3 is untouched.

- name: Wait for the operator to remove the cluster's pods
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --namespace={{ clickhouse.namespace }}
      - --for=delete
      - --timeout=600s
      - pod
      - --all
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: (cluster_state | default('present')) == 'absent'

- name: Delete the namespace (and with it Keeper's volumes)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
    name: "{{ clickhouse.namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: (cluster_state | default('present')) == 'absent'

- name: Teardown summary
  ansible.builtin.debug:
    msg:
      - "cluster removed. S3 data remains in s3://{{ clickhouse.bucket_name }} under ch-s3-*/{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}/ (sharded prefixes -- a plain `aws s3 rm` of one prefix will not find it)"
      - "delete it only on purpose: scripts/s3-purge-cluster-data.sh"
  when: (cluster_state | default('present')) == 'absent'

- name: Stop here when tearing down
  ansible.builtin.meta: end_play
  when: (cluster_state | default('present')) == 'absent'

# --- verification only this cluster needs -----------------------------------

- name: Confirm data is landing in S3 under the key prefix
  # The definitive end-to-end proof: the servers wrote to the bucket, which
  # means the IRSA token was minted, exchanged and accepted.
  #
  # Where to look is not obvious. `enableKeyTemplate` (on by default) makes
  # ClickHouse shard keys for S3 throughput: the layout is
  #   ch-s3-<3 hex chars>/<uuid>/mergetree/...      (data parts)
  #   ch-s3-<3 hex chars>/<uuid>/system/<pod>/...   (system tables)
  # so nothing lives under ch-s3-<uuid>/ itself. Filter on the uuid instead.
  # On a fresh cluster ~1,800 objects appear within a minute of Ready.
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - list-objects-v2
      - --bucket={{ clickhouse.bucket_name }}
      - --prefix=ch-s3-
      - --max-keys=1000
      - --query=length(Contents[?contains(Key, '{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}')] || `[]`)
      - --output=text
      - --profile={{ aws.target_profile }}
  register: _cl_s3
  until: (_cl_s3.stdout | trim | default('0', true) | int) > 0
  retries: 12
  delay: 10
  changed_when: false
  check_mode: false

- name: Show what the operator built
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods,statefulsets,services,pvc
      - --namespace={{ clickhouse.namespace }}
      - -o=wide
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _cl_objects
  changed_when: false
  check_mode: false

- name: Report
  ansible.builtin.debug:
    msg:
      - "cluster:   c-{{ clickhouse.cluster_name }} in {{ clickhouse.namespace }}"
      - "server:    {{ clickhouse.server.replicas }} x {{ versions.server }}{{ fips_suffix }}  ({{ clickhouse.server.cpu }} CPU / {{ clickhouse.server.memory }}, cache {{ clickhouse.server.cache_disk_size }})"
      - "keeper:    {{ clickhouse.keeper.replicas }} x {{ versions.keeper }}{{ fips_suffix }}  ({{ clickhouse.keeper.cpu }} CPU / {{ clickhouse.keeper.memory }}, {{ clickhouse.keeper.disk }} EBS each)"
      - "s3:        {{ _cl_s3.stdout | trim }}+ objects in s3://{{ clickhouse.bucket_name }} under ch-s3-*/{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}/"
      - "admin:     user '{{ clickhouse.admin_username }}', password in {{ admin_password_file | realpath }}"
      - "next:      --tags preflight (Step 10), then --tags verify (Step 11)"

- name: Objects
  ansible.builtin.debug:
    msg: "{{ _cl_objects.stdout_lines }}"

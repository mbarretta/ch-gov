---
# Step 9: deploy a ClickHouseCluster.
#
# Everything before this was scaffolding. This role installs the
# onprem-clickhouse-cluster chart, which renders ONE Kubernetes object that
# matters -- a ClickHouseCluster custom resource -- plus the service account
# it runs as and a ResourceQuota pinning the namespace to a single cluster.
# The operator from Step 8 sees the CR and builds the Keeper StatefulSet,
# one StatefulSet per server replica, their Services and config.
#
# Cost: nothing new. The pods land on the node groups Step 5 already pays for.
# Keeper gets three small EBS volumes; servers are stateless (data in S3,
# metadata in Keeper) and get no volume at all.
#
# Teardown: ansible-playbook deploy.yml --tags cluster -e cluster_state=absent
#   Removes the release, the namespace and Keeper's volumes. The S3 data is NOT
#   touched -- scripts/s3-purge-cluster-data.sh deletes it if you mean it.

- name: Preconditions and inputs (skipped on teardown)
  # Everything the install needs to know or check. None of it applies when
  # removing the cluster -- and checking it would make teardown impossible
  # after the node groups are already gone.
  when: (cluster_state | default('present')) != 'absent'
  block:
    # --- preconditions ---------------------------------------------------------
    # Each of these fails later, and more confusingly, if left unchecked: a CR
    # with no operator is silently ignored; a CR with no nodes leaves pods
    # Pending forever; a missing StorageClass surfaces as an unbound Keeper PVC.

    - name: Require the operator to be running
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace={{ clickhouse.operator_namespace }}
          - --for=condition=Available
          - --timeout=30s
          - deployment
          - --selector=app.kubernetes.io/instance=clickhouse-operator
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_operator
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Fail clearly if the operator is absent or not ready
      ansible.builtin.assert:
        that: _cl_operator.rc == 0
        fail_msg: >-
          The ClickHouse operator is not Available in {{ clickhouse.operator_namespace }}.
          If the node groups are down (the usual reason -- Step 5 is the expensive
          one and gets torn down between sessions), run:
          ansible-playbook deploy.yml --tags nodes. Otherwise: --tags operator.

    - name: Count nodes labelled for each ClickHouse group
      # The label carries the -arm64 suffix on ARM builds (see group_vars,
      # node_label_suffix); the chart's nodeSelector does not. That is the
      # documented convention, and whether the operator bridges it is exactly
      # what the scheduling check below proves.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - --selector=clickhouseGroup={{ item }}{{ node_label_suffix }}
          - --no-headers
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: [keeper, server]
      register: _cl_nodes
      changed_when: false
      check_mode: false

    - name: Fail clearly if the node groups are not there
      ansible.builtin.assert:
        that:
          - _cl_nodes.results[0].stdout_lines | length >= clickhouse.keeper.replicas | int
          - _cl_nodes.results[1].stdout_lines | length >= 1
        fail_msg: >-
          Found {{ _cl_nodes.results[0].stdout_lines | length }} keeper node(s) and
          {{ _cl_nodes.results[1].stdout_lines | length }} server node(s) labelled
          clickhouseGroup=<group>{{ node_label_suffix }}. Keeper needs
          {{ clickhouse.keeper.replicas }} for a quorum. Run:
          ansible-playbook deploy.yml --tags nodes
        success_msg: >-
          nodes: {{ _cl_nodes.results[0].stdout_lines | length }} keeper,
          {{ _cl_nodes.results[1].stdout_lines | length }} server

    - name: Require the StorageClass
      ansible.builtin.command:
        argv: [kubectl, get, storageclass, "{{ clickhouse.storage_class }}", -o=name]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_sc
      changed_when: false
      failed_when: _cl_sc.rc != 0
      check_mode: false

    # --- inputs from earlier steps ---------------------------------------------

    - name: Look up the IRSA role ARN from the Step 6 stack
      # Read from CloudFormation rather than a fact set by the storage_iam role,
      # so this works when run alone with --tags cluster.
      amazon.aws.cloudformation_info:
        stack_name: "{{ infrastructure.environment_name }}-irsa"
        region: "{{ aws.target_region }}"
        profile: "{{ aws.target_profile }}"
      register: _cl_irsa_info
      check_mode: false

    - name: Extract the role ARN
      ansible.builtin.set_fact:
        _cl_s3_role_arn: >-
          {{ _cl_irsa_info.cloudformation[infrastructure.environment_name + '-irsa']
             .stack_outputs.ClickHouseS3RoleArn }}

    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0700"

    - name: Generate (or reuse) the admin and prometheus passwords
      # The password lookup writes the file on first use and reads it back on
      # every run after, so the hash below is stable and helm sees no change.
      # 32 alphanumerics; no symbols, so it pastes cleanly into a shell.
      ansible.builtin.set_fact:
        _cl_admin_pw: "{{ lookup('ansible.builtin.password', admin_password_file ~ ' length=32 chars=ascii_letters,digits') }}"
        _cl_prom_pw: "{{ lookup('ansible.builtin.password', prometheus_password_file ~ ' length=32 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Tighten permissions on the password files
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0600"
      loop:
        - "{{ admin_password_file }}"
        - "{{ prometheus_password_file }}"

    # --- native TLS: a self-signed CA and a leaf server cert it signs -------
    # Only under fips: true. The chart's TLS surface is CA-chain verification
    # only (confirmed against its rendered templates) -- no SNI/hostname/SAN
    # field exists anywhere in server.openSSL/keeper.openSSL's schema -- so one
    # long-lived leaf naming the stable in-cluster service hostnames is
    # sufficient; no LB-hostname-keyed reissue workflow is needed. The SAN
    # list below covers both hostname forms its two callers use
    # (langfuse_clickhouse's bare .svc form, langfuse's migration block's
    # .svc.cluster.local form) plus Keeper's own service, so those roles do
    # not need to reissue this cert. Structured as one block (matching
    # langfuse/tasks/main.yml's own "Terminate TLS at the load balancer"
    # block) so `when: fips` is stated once rather than on every task.
    - name: Generate the ClickHouse native-TLS CA, leaf cert and Secret
      when: fips
      block:
        - name: Read the openssl version
          ansible.builtin.command:
            argv: [openssl, version]
          register: _ch_openssl
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Fail clearly if it is not OpenSSL 3+
          # Same reasoning as langfuse's identical guard: the SAN check below
          # needs `x509 -ext`, and cert generation needs `-noenc` -- both
          # missing from the LibreSSL that ships as /usr/bin/openssl on macOS.
          ansible.builtin.assert:
            that: _ch_openssl.rc == 0 and _ch_openssl.stdout is match('OpenSSL [3-9]')
            fail_msg: "openssl on PATH is '{{ _ch_openssl.stdout | default('') | trim }}' (rc {{ _ch_openssl.rc }}); fips: true needs OpenSSL 3 -- brew install openssl@3 and put /opt/homebrew/bin first on PATH"

        - name: Decide the SANs the ClickHouse TLS leaf certificate must cover
          ansible.builtin.set_fact:
            _ch_tls_host: "c-{{ clickhouse.cluster_name }}-server-any.{{ clickhouse.namespace }}.svc"
            _ch_tls_sans: >-
              DNS:c-{{ clickhouse.cluster_name }}-server-any.{{ clickhouse.namespace }}.svc,
              DNS:c-{{ clickhouse.cluster_name }}-server-any.{{ clickhouse.namespace }}.svc.cluster.local,
              DNS:c-{{ clickhouse.cluster_name }}-keeper.{{ clickhouse.namespace }}.svc,
              DNS:c-{{ clickhouse.cluster_name }}-keeper.{{ clickhouse.namespace }}.svc.cluster.local

        - name: Look for the CA private key
          ansible.builtin.stat:
            path: "{{ clickhouse_tls_ca_key_file }}"
          register: _ch_tls_ca_key
          check_mode: false

        - name: Generate the self-signed CA (missing only -- a CA has no per-host SAN to go stale)
          ansible.builtin.command:
            argv:
              - openssl
              - req
              - -x509
              - -newkey
              - "rsa:{{ tls_rsa_bits }}"
              - -noenc
              - -keyout
              - "{{ clickhouse_tls_ca_key_file }}"
              - -out
              - "{{ clickhouse_tls_ca_cert_file }}"
              - -days
              - "3650"
              - -subj
              - "/CN=clickhouse-private-{{ clickhouse.cluster_name }}-ca"
              - -addext
              - "basicConstraints=critical,CA:true"
          when: not _ch_tls_ca_key.stat.exists
          register: _ch_tls_ca_gen
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

        - name: Keep the CA key owner-readable only
          ansible.builtin.file:
            path: "{{ clickhouse_tls_ca_key_file }}"
            mode: "0600"
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

        - name: Read the SAN of the leaf certificate already there, if any
          # Same idempotency approach as ansible/roles/langfuse/tasks/main.yml's
          # cert-generation block: SAN check with failed_when: false (no file,
          # or not a certificate, both just mean "regenerate").
          ansible.builtin.command:
            argv: [openssl, x509, -in, "{{ clickhouse_tls_cert_file }}", -noout, -ext, subjectAltName]
          register: _ch_tls_leaf_san
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Look for the leaf private key
          ansible.builtin.stat:
            path: "{{ clickhouse_tls_key_file }}"
          register: _ch_tls_leaf_key
          check_mode: false

        - name: Generate a CSR for the leaf certificate (missing, stale SAN, or a fresh CA)
          ansible.builtin.command:
            argv:
              - openssl
              - req
              - -new
              - -newkey
              - "rsa:{{ tls_rsa_bits }}"
              - -noenc
              - -keyout
              - "{{ clickhouse_tls_key_file }}"
              - -out
              - "{{ state_dir }}/clickhouse-tls-leaf.csr"
              - -subj
              - "/CN={{ _ch_tls_host }}"
              - -addext
              - "subjectAltName={{ _ch_tls_sans }}"
          when: >-
            not _ch_tls_leaf_key.stat.exists
            or _ch_tls_leaf_san.rc != 0
            or ('DNS:' ~ _ch_tls_host) not in _ch_tls_leaf_san.stdout
            or (_ch_tls_ca_gen.changed | default(false))
          register: _ch_tls_leaf_csr
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

        - name: Sign the leaf certificate with the CA
          # -copy_extensions carries the CSR's subjectAltName through --
          # `openssl x509 -req` drops extensions by default.
          ansible.builtin.command:
            argv:
              - openssl
              - x509
              - -req
              - -in
              - "{{ state_dir }}/clickhouse-tls-leaf.csr"
              - -CA
              - "{{ clickhouse_tls_ca_cert_file }}"
              - -CAkey
              - "{{ clickhouse_tls_ca_key_file }}"
              - -CAcreateserial
              - -CAserial
              - "{{ state_dir }}/clickhouse-tls-ca.srl"
              - -out
              - "{{ clickhouse_tls_cert_file }}"
              - -days
              - "825"
              - -copy_extensions
              - copy
          when: _ch_tls_leaf_csr is defined and _ch_tls_leaf_csr is changed
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

        - name: Keep the leaf key owner-readable only
          ansible.builtin.file:
            path: "{{ clickhouse_tls_key_file }}"
            mode: "0600"
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

        - name: Ensure the ClickHouse namespace exists
          # The Secret below must land before the operator builds pods;
          # helm's own create_namespace (in the install task further down)
          # would otherwise be the first thing to create it, too late for
          # this. Plain `present` -- idempotent alongside helm's
          # create_namespace either way.
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Namespace
            name: "{{ clickhouse.namespace }}"
            state: present

        - name: Write the CA and leaf cert/key into the Secret the chart's openSSL blocks reference
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ clickhouse_tls_secret_name }}"
                namespace: "{{ clickhouse.namespace }}"
              type: Opaque
              stringData:
                server.crt: "{{ lookup('ansible.builtin.file', clickhouse_tls_cert_file) }}"
                server.key: "{{ lookup('ansible.builtin.file', clickhouse_tls_key_file) }}"
                ca.crt: "{{ lookup('ansible.builtin.file', clickhouse_tls_ca_cert_file) }}"
          no_log: "{{ not (show_secrets | default(false) | bool) }}"

    # --- optional: the JWT user directory (Step 11b's server side) -------------
    # Off unless sso.enabled and sso.clickhouse_jwt.enabled. When off, none of
    # this runs and the release below is given exactly the values it had before
    # this block existed (values_files stays empty).
    #
    # What the server does with a token, in JWKS mode (the only mode used):
    #   - The signature must verify against a key in the pool's JWKS (RS256).
    #   - aud is mandatory in the config and on the token. A token with no aud
    #     claim is rejected, and so is one whose aud differs from the configured
    #     value. A Cognito ID token carries aud equal to the app client ID, so
    #     the kit presents the ID token.
    #   - iss is NOT validated. Trust rests on the JWKS signature plus aud alone,
    #     so iss below only shapes the ClickHouse user name, and neither it nor
    #     networks nor permission_limit repairs claim validation: networks limits
    #     where logins may come from, permission_limit caps what a login may do.
    #   - Roles come from the cognito:groups claim, which must be a top-level
    #     array of group names. A name with no matching ClickHouse role is
    #     dropped without an error. A login's rights are granted to it directly
    #     (currentRoles() stays empty; read them with SHOW GRANTS) and are the
    #     intersection of its groups' roles and the permission_limit role.
    #   - The directory sits beside the chart's existing Keeper-backed access
    #     storage, so admin, prometheus and the service users keep working.
    #
    # The server crashes (a null dereference) if a token carrying a kid arrives
    # while the JWKS has never loaded. So the JWKS URL must be reachable from a
    # pod BEFORE the directory is enabled; the probe below is that gate.
    #
    # JWKS mode is exercised on the -fips image (amd64) and on the standard image
    # (arm64), so the block is not restricted to fips: true.
    - name: Wire the JWT user directory into the cluster values
      when:
        - sso.enabled | bool
        - sso.clickhouse_jwt.enabled | bool
      block:
        - name: Read the Cognito outputs state file
          ansible.builtin.stat:
            path: "{{ sso_state_files.outputs_file }}"
          register: _cl_jwt_out_stat
          check_mode: false

        - name: Fail clearly if Step 6b has not written it
          ansible.builtin.assert:
            that: _cl_jwt_out_stat.stat.exists
            fail_msg: >-
              {{ sso_state_files.outputs_file }} is missing. The JWT user directory needs the
              Cognito issuer, JWKS URL and ClickHouse app client ID that Step 6b records.
              Run: ansible-playbook deploy.yml --tags sso-idp

        - name: Load the Cognito outputs
          ansible.builtin.set_fact:
            _cl_jwt_out: "{{ lookup('ansible.builtin.file', sso_state_files.outputs_file) | from_json }}"

        - name: Fail clearly if an output the directory needs is absent
          ansible.builtin.assert:
            that:
              - _cl_jwt_out.issuer | default('') | length > 0
              - _cl_jwt_out.clickhouse_client_id | default('') | length > 0
              - _cl_jwt_out.jwks_uri | default('') is match('^https://[A-Za-z0-9._~:/?&=%+@,-]+$')
            fail_msg: >-
              {{ sso_state_files.outputs_file }} needs issuer, clickhouse_client_id and an
              https jwks_uri made of URL characters only. Re-run: ansible-playbook
              deploy.yml --tags sso-idp

        - name: Probe the JWKS URL from a pod on a server node
          # A throwaway pod from the server image, on the server node group, so
          # the network path is the one the server pods will use. clickhouse-local
          # fetches the URL with the server's own TLS stack, which needs no FIPS
          # OpenSSL workaround (the image's wget does), and the query only passes
          # when the body is a JWKS document. The pod goes in `default`,
          # which exists on a first install; the ClickHouse namespace may not.
          # The marker is checked instead of the exit status because kubectl run
          # does not reliably relay the container's exit code.
          ansible.builtin.command:
            argv:
              - kubectl
              - run
              - ch-jwks-probe
              - --namespace=default
              - --image={{ target_registry }}/clickhouse-server:{{ versions.server }}{{ fips_suffix }}
              - --restart=Never
              - --rm
              - -i
              - --quiet
              - --pod-running-timeout=5m
              - --overrides={{ _cl_jwt_probe_overrides | to_json }}
              - --command
              - --
              - sh
              - -c
              - >-
                q="SELECT count() FROM url('$0', 'JSONAsString') WHERE json LIKE '%\"keys\"%'";
                out=$(clickhouse-local --http_max_tries=1 --http_connection_timeout=15
                --http_receive_timeout=15 --query "$q" 2>&1);
                if [ "$out" = 1 ]; then echo JWKS_REACHABLE; else echo "JWKS_UNREACHABLE: $out"; fi
              - "{{ _cl_jwt_out.jwks_uri }}"
          vars:
            _cl_jwt_probe_overrides:
              spec:
                nodeSelector:
                  clickhouseGroup: "server{{ node_label_suffix }}"
                tolerations:
                  - {key: clickhouse.com/do-not-schedule, operator: Exists, effect: NoSchedule}
          environment:
            KUBECONFIG: "{{ kubeconfig_path }}"
          register: _cl_jwt_probe
          failed_when: false
          changed_when: false
          check_mode: false

        - name: Fail before Helm touches the cluster if the JWKS is not reachable
          ansible.builtin.assert:
            that: "'JWKS_REACHABLE' in _cl_jwt_probe.stdout"
            fail_msg: >-
              A pod on the server nodes cannot fetch {{ _cl_jwt_out.jwks_uri }}
              ({{ (_cl_jwt_probe.stdout ~ _cl_jwt_probe.stderr) | trim | truncate(400) }}).
              The JWT user directory is not enabled, because a ClickHouse server whose
              JWKS never loaded crashes on the first token that carries a key ID. Fix
              the route from the server nodes to Cognito (NAT or a VPC endpoint), then re-run.

        - name: Write the JWT user directory values
          # No secret in here: the issuer, the app client ID (public) and the
          # JWKS URL. Kept under state/ so helm reads it as a values file.
          ansible.builtin.copy:
            dest: "{{ state_dir }}/clickhouse-jwt-values.yaml"
            mode: "0600"
            content: "{{ _cl_jwt_values | to_nice_yaml(indent=2) }}"
          vars:
            _cl_jwt_values:
              server:
                config:
                  user_directories:
                    jwt:
                      aud: "{{ _cl_jwt_out.clickhouse_client_id }}"
                      iss: "{{ _cl_jwt_out.issuer }}"
                      jwks:
                        url: "{{ _cl_jwt_out.jwks_uri }}"
                        update_interval_ms: 300000
                      permission_limit:
                        role: "{{ sso_jwt_ceiling_role }}"
                      remap_claims:
                        roles: "cognito:groups"
                      networks:
                        ip: "{{ (sso.clickhouse_jwt.networks | default([], true)) or [infrastructure.vpc_cidr] }}"
          check_mode: false

        - name: Remember the values file for the release
          ansible.builtin.set_fact:
            _cl_jwt_values_file: "{{ state_dir }}/clickhouse-jwt-values.yaml"


# --- the release -------------------------------------------------------------

- name: Log in to the ECR Helm registry
  ansible.builtin.command:
    argv:
      - aws
      - ecr
      - get-login-password
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  register: _cl_ecr_token
  changed_when: false
  check_mode: false
  no_log: true            # stdout IS the credential

- name: Authenticate helm against ECR
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - --username=AWS
      - --password-stdin
      - "{{ target_registry }}"
    stdin: "{{ _cl_ecr_token.stdout }}"
  changed_when: false
  check_mode: false
  no_log: true            # stdin carries the credential

- name: Wait for the cluster-count ResourceQuota to report its usage
  # Read-only. The chart ships a ResourceQuota that counts ClickHouseCluster
  # objects (count/clickhouseclusters.clickhouse.com: 1). On a fresh cluster
  # kube-controller-manager does not fill in status.used for a just-created CRD
  # for several minutes, and the API server rejects the ClickHouseCluster CR
  # until it does. Observed on a cold start: helm reported
  #   server-side apply failed for object <ns>/c-<name> ... is forbidden:
  #   status unknown for quota: <release>-onprem-clickhouse-cluster
  # right after the operator's CRD was created, and status.used appeared about
  # 260 seconds later. Retrying at once fails the same way.
  #
  # This gate covers a quota that already exists (a re-run after that failure,
  # or an upgrade). On a first install the chart has not created the quota yet,
  # so there is nothing to wait on here; the install task below retries on that
  # same error instead. Quotas are matched by the resource they count, not by
  # name, because the chart derives the name from the release.
  when: (cluster_state | default('present')) != 'absent'
  vars:
    _cl_count_key: count/clickhouseclusters.clickhouse.com
    _cl_quotas: >-
      {{ (_cl_quota_wait.stdout | default('{"items": []}') | from_json)['items']
         | selectattr('spec.hard', 'defined')
         | selectattr('spec.hard', 'contains', _cl_count_key) | list }}
    _cl_quotas_unset: >-
      {{ (_cl_quotas | rejectattr('status.used', 'defined') | list)
         + (_cl_quotas | selectattr('status.used', 'defined')
            | rejectattr('status.used', 'contains', _cl_count_key) | list) }}
  block:
    - name: Read the cluster-count ResourceQuota until status.used is populated
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - resourcequota
          - --namespace={{ clickhouse.namespace }}
          - -o=json
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_quota_wait
      until: _cl_quota_wait.rc == 0 and (_cl_quotas_unset | length) == 0
      retries: 72             # x 10 s = 12 minutes; the observed wait was ~4.5
      delay: 10
      failed_when: false      # the verdict, with a useful message, is next
      changed_when: false
      check_mode: false       # read-only, so it also gates under --check

    - name: Fail clearly if the ResourceQuota never reported its usage
      ansible.builtin.fail:
        msg: >-
          ResourceQuota {{ _cl_quotas_unset | map(attribute='metadata.name') | join(', ') | default('for ' ~ _cl_count_key, true) }}
          in namespace {{ clickhouse.namespace }} still has no status.used for
          {{ _cl_count_key }} after 12 minutes, so the API server would reject the
          ClickHouseCluster. Check: kubectl get resourcequota -n {{ clickhouse.namespace }} -o yaml
          (kubectl error, if any: {{ _cl_quota_wait.stderr | default('none') }})
      when: _cl_quota_wait.rc != 0 or (_cl_quotas_unset | length) > 0

- name: Install the ClickHouse cluster
  # Release name == cluster name. The chart derives everything from it: the
  # CR is c-<name>, the service account ch-<name>-sa, the Keeper StatefulSet
  # c-<name>-keeper. The IRSA trust policy from Step 6 names that service
  # account, so the name is not free to change.
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ clickhouse.cluster_name }}"
    chart_ref: "oci://{{ target_registry }}/helm/onprem-clickhouse-cluster"
    chart_version: "{{ versions.cluster_chart }}"
    release_namespace: "{{ clickhouse.namespace }}"
    create_namespace: true
    release_state: "{{ cluster_state | default('present') }}"
    wait: false           # we wait on the operator's objects below, with diagnostics
    # Helm 4 applies server-side, and the operator writes to the same CR under
    # its own field manager ("manager"). The second `helm upgrade` then fails:
    #   conflict with "manager" using clickhouse.com/v1: .spec.featureFlags.enableSecurePorts
    # This is the Helm-v4-with-an-operator case, not a mistake: the chart is
    # the source of truth for the fields it renders, so it takes them back.
    # kubernetes.core >= 6.5 exposes the flag; older versions have no way to
    # pass it, which is one reason Part 1 pins the collection floor.
    force_conflicts: true
    # Empty unless the JWT user directory is on (see the block above); the
    # module passes a values file ahead of `values`, and the two merge key by key.
    values_files: "{{ [_cl_jwt_values_file] if _cl_jwt_values_file is defined else [] }}"
    values:
      account:
        username: "{{ clickhouse.admin_username }}"
        # base64 of the HEX sha256 digest -- not of the raw digest bytes. That
        # is what the chart's own `sha256sum | b64enc` produces from a plain
        # password, and what the operator expects.
        # `default` because on teardown the block above is skipped and these
        # facts are unset; helm uninstall ignores the values but the module
        # still renders them.
        hashedPassword: "{{ _cl_admin_pw | default('') | hash('sha256') | b64encode }}"

      # Storage: the shared class from Step 7, created separately -- do not
      # let this release try to create it again.
      storageClass:
        create: false

      serviceAccount:
        create: true
        annotations:
          # The IRSA wiring. Pods running as ch-<name>-sa get AWS_ROLE_ARN and
          # a projected token from this one annotation; no key anywhere.
          eks.amazonaws.com/role-arn: "{{ _cl_s3_role_arn | default('') }}"

      server:
        image:
          # Point at YOUR registry, and pin the tag we mirrored in Step 2. The
          # chart would otherwise use its own pinned tag, which happens to
          # match today but is not something to rely on -- and it cannot know
          # about the -fips suffix.
          repository: "{{ target_registry }}/clickhouse-server"
          tag: "{{ versions.server }}{{ fips_suffix }}"
        replicaCount: "{{ clickhouse.server.replicas | int }}"
        # ARM build: adds the clickhouse.com/arch=arm64 toleration matching
        # the taint Step 5 puts on Graviton keeper nodes, and labels the CR
        # arm64-preferred. FIPS is x86 throughout, so false there.
        arm64: "{{ not fips }}"
        podPolicy:
          nodeSelector:
            # WITH the -arm64 suffix on ARM builds, matching the node labels
            # from Step 5 exactly. The chart's comment says to leave the
            # suffix off because a mutating webhook appends it -- but Step 8
            # disables webhooks (per the tutorial), and the operator does not
            # append it either: with a selector of plain `keeper`, every Keeper
            # pod stays Pending with "8 node(s) didn't match Pod's node
            # affinity/selector". The selector has to say what the nodes say.
            clickhouseGroup: "server{{ node_label_suffix }}"
          resources:
            limits:   {cpu: "{{ clickhouse.server.cpu }}", memory: "{{ clickhouse.server.memory }}"}
            requests: {cpu: "{{ clickhouse.server.cpu }}", memory: "{{ clickhouse.server.memory }}"}
        # Step 5 taints the server and keeper node groups
        # clickhouse.com/do-not-schedule=true:NoSchedule so nothing else lands
        # on them. The chart ships tolerations: [] and its README says to add
        # the matching toleration here -- so we do, for both server and keeper.
        # If the operator also injects one, this is a harmless duplicate.
        tolerations:
          - {key: clickhouse.com/do-not-schedule, operator: Exists, effect: NoSchedule}
        ssdCacheConfiguration:
          # Read cache on the node's local NVMe. The chart converts this to
          # bytesPerGiRAM using the memory limit above. See group_vars for
          # why 300Gi.
          cacheDiskSize: "{{ clickhouse.server.cache_disk_size }}"
        storage:
          storageClassName: "{{ clickhouse.storage_class }}"
          s3:
            bucketName: "{{ clickhouse.bucket_name }}"
            keyPrefix: "{{ clickhouse.s3_key_prefix }}"
            # BOTH must be set. The chart's AWS defaults are us-west-2 for
            # each; deploy without these and ClickHouse tries to put your data
            # in the wrong region, and the IRSA role (scoped to one bucket ARN,
            # which is region-agnostic) would even let it try.
            region: "{{ aws.target_region }}"
            # s3_endpoint (group_vars) is FIPS-aware -- this is ClickHouse's
            # own in-pod S3 client, authenticating via its IRSA service
            # account, so it needs the FIPS hostname itself; the controller's
            # .aws/config has no bearing on it. See the endpoint-coverage
            # matrix in group_vars/all.yml.
            endpoint: "{{ s3_endpoint }}"
        # server.openSSL.required: true zeroes
        # http_port/tcp_port (and the cloud.port readiness listener) for
        # EVERY caller, not just the load balancer -- clickhouse_loadbalancer
        # and scripts/ch-client.sh move to the secure ports under fips: true
        # accordingly. `secret` names the Secret the block above writes;
        # verificationMode is left at the chart's own default (none -- this
        # is CA-chain verification of the server's own cert, not mutual TLS).
        openSSL:
          enabled: "{{ fips }}"
          required: "{{ fips }}"
          secret:
            name: "{{ clickhouse_tls_secret_name }}"
        loggerConfig:
          loggerLevel: "{{ clickhouse.server.log_level }}"
        prometheus:
          user:
            # Created by default with an EMPTY password unless one is given.
            # We have no Prometheus here, but the user exists either way, so
            # give it a real secret.
            create: true
            password: "{{ _cl_prom_pw | default('') }}"

      keeper:
        image:
          repository: "{{ target_registry }}/clickhouse-keeper"
          tag: "{{ versions.keeper }}{{ fips_suffix }}"
        replicaCount: "{{ clickhouse.keeper.replicas | int }}"
        arm64: "{{ not fips }}"
        podPolicy:
          nodeSelector:
            clickhouseGroup: "keeper{{ node_label_suffix }}"   # see server above
          resources:
            limits:   {cpu: "{{ clickhouse.keeper.cpu }}", memory: "{{ clickhouse.keeper.memory }}"}
            requests: {cpu: "{{ clickhouse.keeper.cpu }}", memory: "{{ clickhouse.keeper.memory }}"}
        tolerations:
          - {key: clickhouse.com/do-not-schedule, operator: Exists, effect: NoSchedule}
        storage:
          storageClassName: "{{ clickhouse.storage_class }}"
          resources:
            requests: "{{ clickhouse.keeper.disk }}"
        # Same Secret and CA-chain model as server.openSSL above -- the
        # identical five-field tlsConfiguration shape renders for Keeper.
        # Unlike the server, this chart does NOT confirm whether
        # `required: true` also disables Keeper's plaintext listener (that is
        # the operator chart's call, not this one's) -- the conservative
        # default is to not assume it is auto-disabled, so
        # nothing downstream of this role currently depends on Keeper's
        # plaintext port being gone.
        openSSL:
          enabled: "{{ fips }}"
          required: "{{ fips }}"
          # Keeper's chart schema defaults certKey/keyKey to keeper.crt/keeper.key,
          # but the Secret above only ever writes server.crt/server.key/ca.crt --
          # one shared leaf cert for both server and keeper.
          # Override to the keys that actually exist so fips: true's mTLS wiring
          # doesn't reference a nonexistent Secret key.
          secret:
            name: "{{ clickhouse_tls_secret_name }}"
            certKey: server.crt
            keyKey: server.key
        loggerConfig:
          loggerLevel: "{{ clickhouse.keeper.log_level }}"
  register: _cl_release
  # First install: the chart creates the quota and the ClickHouseCluster in one
  # apply, so the gate above had nothing to wait on and helm hits the
  # "status unknown for quota" rejection described there. Retry on that error
  # only, for at least 10 minutes; any other failure stops at once.
  until: >-
    _cl_release is succeeded or
    'status unknown for quota' not in ((_cl_release.msg | default('')) ~ (_cl_release.stderr | default('')))
  retries: 72
  delay: 10
  # The values carry both password hashes, so the result is hidden -- which
  # also hides the error when the install fails. Re-run with
  # -e show_secrets=true to see it (the hashes are sha256, not the passwords).
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

- name: Report the release
  ansible.builtin.debug:
    msg: "release {{ clickhouse.cluster_name }} in {{ clickhouse.namespace }}: {{ _cl_release.status.status | default(cluster_state | default('present')) }}"

- name: Find Pending pods left on a stale StatefulSet revision
  # The operator's StatefulSets use updateStrategy OnDelete, so a changed pod
  # template (a corrected nodeSelector, say) is NOT rolled out to existing
  # pods. A pod that never scheduled cannot be fixed by anything but deletion,
  # and the operator defers its own evictions until every Keeper PVC is bound
  # -- which a Pending pod's WaitForFirstConsumer PVC never will be. That is
  # a deadlock, so we break it: delete Pending pods whose revision hash is not
  # the StatefulSet's current one. Running pods are never touched.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      kubectl get pods --namespace={{ clickhouse.namespace }}
      --field-selector=status.phase=Pending
      -o=jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.controller-revision-hash}{" "}{.metadata.ownerReferences[0].name}{"\n"}{end}'
      | while read -r pod rev sts; do
          [ -n "$sts" ] || continue;
          cur="$(kubectl get statefulset "$sts" --namespace={{ clickhouse.namespace }} -o=jsonpath='{.status.updateRevision}' 2>/dev/null)";
          [ -n "$cur" ] && [ "$rev" != "$cur" ] && echo "$pod";
        done
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _cl_stale
  changed_when: false
  failed_when: false
  check_mode: false
  when: (cluster_state | default('present')) != 'absent'

- name: Delete them so the StatefulSet recreates them from the current template
  ansible.builtin.command:
    argv: "{{ ['kubectl', 'delete', 'pod', '--namespace=' ~ clickhouse.namespace, '--wait=false'] + _cl_stale.stdout_lines }}"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  check_mode: false
  when:
    - (cluster_state | default('present')) != 'absent'
    - _cl_stale.stdout_lines | default([]) | length > 0

# --- teardown ---------------------------------------------------------------
# helm uninstall removes the CR; the operator then deletes the StatefulSets.
# The Keeper PVCs survive that (StatefulSet semantics), and so does the
# namespace. Removing the namespace takes the PVCs with it, and the
# StorageClass's Delete reclaim policy takes the EBS volumes. S3 is untouched.

- name: Wait for the operator to remove the cluster's pods
  ansible.builtin.command:
    argv:
      - kubectl
      - wait
      - --namespace={{ clickhouse.namespace }}
      - --for=delete
      - --timeout=600s
      - pod
      - --all
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  failed_when: false
  check_mode: false
  when: (cluster_state | default('present')) == 'absent'

- name: Delete the namespace (and with it Keeper's volumes)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Namespace
    name: "{{ clickhouse.namespace }}"
    state: absent
    wait: true
    wait_timeout: 300
  when: (cluster_state | default('present')) == 'absent'

- name: Teardown summary
  ansible.builtin.debug:
    msg:
      - "cluster removed. S3 data remains in s3://{{ clickhouse.bucket_name }} under ch-s3-*/{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}/ (sharded prefixes -- a plain `aws s3 rm` of one prefix will not find it)"
      - "delete it only on purpose: scripts/s3-purge-cluster-data.sh"
  when: (cluster_state | default('present')) == 'absent'

- name: Stop here when tearing down
  ansible.builtin.meta: end_play
  when: (cluster_state | default('present')) == 'absent'

# --- wait for the operator to build it, with diagnostics on failure ---------
# The operator works in order: Keeper first (servers cannot start without a
# quorum to talk to), then one StatefulSet per server replica. Each wait has
# a rescue that dumps the pods and the scheduler's reasons, because the
# failure modes here -- nodeSelector mismatch, a taint without its toleration,
# an image that cannot be pulled -- all look identical from the outside: a
# pod that is Pending and a `kubectl wait` that times out.

- name: Wait for Keeper, then the servers
  block:
    - name: Wait for the ClickHouseCluster resource to be accepted
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - clickhousecluster
          - c-{{ clickhouse.cluster_name }}
          - --namespace={{ clickhouse.namespace }}
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_cr
      until: _cl_cr.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      check_mode: false

    - name: Wait for the Keeper StatefulSet to appear
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - statefulset
          - c-{{ clickhouse.cluster_name }}-keeper
          - --namespace={{ clickhouse.namespace }}
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_keeper_sts
      until: _cl_keeper_sts.rc == 0
      retries: 36
      delay: 5
      changed_when: false
      check_mode: false

    - name: Wait for the Keeper quorum ({{ clickhouse.keeper.replicas }} replicas Ready)
      # Not `kubectl rollout status`: the operator creates the StatefulSet with
      # updateStrategy OnDelete (it manages pod replacement itself), and
      # rollout status refuses those outright. Watch the status field instead.
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace={{ clickhouse.namespace }}
          - --for=jsonpath={.status.readyReplicas}={{ clickhouse.keeper.replicas }}
          - --timeout=600s
          - statefulset/c-{{ clickhouse.cluster_name }}-keeper
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      check_mode: false

    - name: Wait for the server pods to exist
      # One StatefulSet per replica (multi-StatefulSet mode), each with a
      # generated suffix -- so select pods by label, never by guessed name.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace={{ clickhouse.namespace }}
          - --selector=app.kubernetes.io/name=clickhouse-server
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_server_pods
      until: _cl_server_pods.stdout_lines | length >= clickhouse.server.replicas | int
      retries: 60
      delay: 5
      changed_when: false
      check_mode: false

    - name: Wait for every server pod to be Ready
      # Image pull (~1 GB per architecture), then ClickHouse start-up against
      # S3 and Keeper. 15 minutes is generous on purpose; a rescue is worse.
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace={{ clickhouse.namespace }}
          - --for=condition=Ready
          - --timeout=900s
          - pod
          - --selector=app.kubernetes.io/name=clickhouse-server
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      check_mode: false

  rescue:
    - name: Show every pod in the namespace
      ansible.builtin.command:
        argv: [kubectl, get, pods, "--namespace={{ clickhouse.namespace }}", -o=wide]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_rescue_pods
      changed_when: false
      check_mode: false

    - name: Show the scheduler's and kubelet's reasons
      # Warning events carry the actual cause: "0/8 nodes are available:
      # 3 node(s) didn't match Pod's node affinity/selector, 3 node(s) had
      # untolerated taint ..." or "Failed to pull image ...".
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - events
          - --namespace={{ clickhouse.namespace }}
          - --field-selector=type=Warning
          - --sort-by=.lastTimestamp
          - -o=custom-columns=LAST:.lastTimestamp,OBJECT:.involvedObject.name,REASON:.reason,MESSAGE:.message
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_rescue_events
      changed_when: false
      check_mode: false

    - name: Show the operator's recent log
      ansible.builtin.command:
        argv:
          - kubectl
          - logs
          - --namespace={{ clickhouse.operator_namespace }}
          - --selector=app.kubernetes.io/instance=clickhouse-operator
          - --container=manager
          - --tail=40
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _cl_rescue_oplog
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The cluster did not come up
      ansible.builtin.fail:
        msg:
          - "--- pods ---"
          - "{{ _cl_rescue_pods.stdout_lines }}"
          - "--- warning events (newest last) ---"
          - "{{ _cl_rescue_events.stdout_lines | default([]) }}"
          - "--- operator log tail ---"
          - "{{ _cl_rescue_oplog.stdout_lines | default([]) }}"
          - "The release is still installed; fix the cause and re-run --tags cluster, or tear down with -e cluster_state=absent."

# --- verification ----------------------------------------------------------

- name: Confirm every container pulls from your ECR
  # Same assertion as Step 8, and it matters more here: the operator
  # generates init containers whose registry comes from
  # IMAGE_REGISTRY_BASE_PATH, not from any chart value you set in this role.
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace={{ clickhouse.namespace }}
      - -o=jsonpath={range .items[*]}{range .spec.initContainers[*]}{.image}{"\n"}{end}{range .spec.containers[*]}{.image}{"\n"}{end}{end}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _cl_images
  changed_when: false
  check_mode: false

- name: Assert no container pulls from outside your registry
  ansible.builtin.assert:
    that: _cl_images.stdout_lines | reject('search', '^' ~ target_registry) | list | length == 0
    fail_msg: >-
      These containers do not come from {{ target_registry }}:
      {{ _cl_images.stdout_lines | reject('search', '^' ~ target_registry) | unique | list | join(', ') }}
    success_msg: >-
      all {{ _cl_images.stdout_lines | length }} containers (init included) pull from {{ target_registry }}

- name: Confirm IRSA reached the server pods
  # The kubelet injects these two env vars when the pod's service account is
  # annotated. If they are missing, the pod has no AWS identity and the first
  # S3 write fails with AccessDenied deep inside ClickHouse's logs.
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace={{ clickhouse.namespace }}
      - --selector=app.kubernetes.io/name=clickhouse-server
      # The server container is named c-<cluster>-server, not clickhouse-server
      # (the label says clickhouse-server; the container does not). It is the
      # pod's only container, so index it rather than name it.
      - -o=jsonpath={range .items[*]}{.metadata.name}{" sa="}{.spec.serviceAccountName}{" role="}{.spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}{"\n"}{end}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _cl_irsa
  changed_when: false
  check_mode: false

- name: Assert the service account and role are the ones Step 6 trusts
  ansible.builtin.assert:
    that:
      - _cl_irsa.stdout_lines | select('search', 'sa=' ~ clickhouse.service_account ~ ' ') | list | length == clickhouse.server.replicas | int
      - _cl_irsa.stdout_lines | select('search', 'role=' ~ _cl_s3_role_arn) | list | length == clickhouse.server.replicas | int
    fail_msg: "IRSA wiring is off: {{ _cl_irsa.stdout_lines }}"
    success_msg: "{{ clickhouse.server.replicas }} server pods run as {{ clickhouse.service_account }} with AWS_ROLE_ARN={{ _cl_s3_role_arn | regex_replace('^.*/', '') }}"

- name: Confirm data is landing in S3 under the key prefix
  # The definitive end-to-end proof: the servers wrote to the bucket, which
  # means the IRSA token was minted, exchanged and accepted.
  #
  # Where to look is not obvious. `enableKeyTemplate` (on by default) makes
  # ClickHouse shard keys for S3 throughput: the layout is
  #   ch-s3-<3 hex chars>/<uuid>/mergetree/...      (data parts)
  #   ch-s3-<3 hex chars>/<uuid>/system/<pod>/...   (system tables)
  # so nothing lives under ch-s3-<uuid>/ itself. Filter on the uuid instead.
  # On a fresh cluster ~1,800 objects appear within a minute of Ready.
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - list-objects-v2
      - --bucket={{ clickhouse.bucket_name }}
      - --prefix=ch-s3-
      - --max-keys=1000
      - --query=length(Contents[?contains(Key, '{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}')] || `[]`)
      - --output=text
      - --profile={{ aws.target_profile }}
  register: _cl_s3
  until: (_cl_s3.stdout | trim | default('0', true) | int) > 0
  retries: 12
  delay: 10
  changed_when: false
  check_mode: false

- name: Show what the operator built
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods,statefulsets,services,pvc
      - --namespace={{ clickhouse.namespace }}
      - -o=wide
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _cl_objects
  changed_when: false
  check_mode: false

- name: Report
  ansible.builtin.debug:
    msg:
      - "cluster:   c-{{ clickhouse.cluster_name }} in {{ clickhouse.namespace }}"
      - "server:    {{ clickhouse.server.replicas }} x {{ versions.server }}{{ fips_suffix }}  ({{ clickhouse.server.cpu }} CPU / {{ clickhouse.server.memory }}, cache {{ clickhouse.server.cache_disk_size }})"
      - "keeper:    {{ clickhouse.keeper.replicas }} x {{ versions.keeper }}{{ fips_suffix }}  ({{ clickhouse.keeper.cpu }} CPU / {{ clickhouse.keeper.memory }}, {{ clickhouse.keeper.disk }} EBS each)"
      - "s3:        {{ _cl_s3.stdout | trim }}+ objects in s3://{{ clickhouse.bucket_name }} under ch-s3-*/{{ clickhouse.s3_key_prefix | regex_replace('^ch-s3-', '') }}/"
      - "admin:     user '{{ clickhouse.admin_username }}', password in {{ admin_password_file | realpath }}"
      - "next:      --tags preflight (Step 10), then --tags verify (Step 11)"

- name: Objects
  ansible.builtin.debug:
    msg: "{{ _cl_objects.stdout_lines }}"

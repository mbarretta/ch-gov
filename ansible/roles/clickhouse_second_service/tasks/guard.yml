---
# A guard against switching the second service off while it is still there.
#
# deploy.yml imports this file at the end of its pre_tasks, tagged like the
# three steps it protects, so it runs before any of them on every run that
# would reach one: Step 5 (eks_nodegroups) shrinks the second-server node
# group to 0 nodes, Step 6 (storage_iam) drops the second service's account
# from the IRSA trust policy, and Step 8 (clickhouse_operator) turns the
# operator's private-Hydra feature flag back off, all as soon as
# clickhouse.second_service.enabled is false. The last one matters most:
# without the flag the parent no longer tracks the child, and the parent's
# replica cleanup can remove the child's replicas from the shared Keeper.
#
# So when the switch is off but the child's release or its ClickHouseCluster
# is still in the cluster, the run stops here, before anything changes, and
# says how to remove the second service first. Its teardowns run with the
# switch off too, and this guard is what keeps the operator's flag on until
# they have.
#
# Nothing here runs while the switch is on. It also stands aside for the
# second service's own teardowns (second_service_state or second_lb_state
# set to absent), and for a single scripts/down.sh step: one tag from
# down.sh's plan with that step's own <name>_state set to absent. down.sh
# removes the second service before anything it depends on, and of its steps
# only operator, nodes and storage carry a tag this guard runs under; the
# rest of the table is there so it matches down.sh line for line. Any other
# <name>_state=absent, or a teardown state passed on a run with more tags than
# that one step, gets checked like any other run.
#
# On a fresh deployment there is no kubeconfig yet, and after scripts/down.sh
# --all the kubeconfig names an EKS cluster that no longer exists; neither has
# a second service, so both pass. A kubeconfig whose cluster does not answer
# (expired credentials, an unreachable API endpoint) is different: the run
# cannot tell whether the second service is still there, so it stops.

- name: Guard against a second service left running with its switch off
  vars:
    # scripts/down.sh's teardown plan, tag to state variable.
    _ssg_down_steps:
      lf-app: langfuse_state
      lf-db: langfuse_db_state
      gf-app: grafana_state
      gf-db: grafana_db_state
      second-lb: second_lb_state
      second-service: second_service_state
      lb: lb_state
      cluster: cluster_state
      sso-idp: sso_idp_state
      operator: operator_state
      prereqs: prereqs_state
      lf-storage: langfuse_storage_state
      gf-storage: grafana_storage_state
      nodes: nodegroups_state
      storage: storage_state
      eks: eks_state
      vpc: vpc_state
    _ssg_down_step: >-
      {{ (ansible_run_tags | length) == 1
         and ansible_run_tags[0] in _ssg_down_steps
         and lookup('ansible.builtin.vars', _ssg_down_steps[ansible_run_tags[0]], default='present') == 'absent' }}
    _ssg_teardown: >-
      {{ (second_service_state | default('present')) == 'absent'
         or (second_lb_state | default('present')) == 'absent'
         or (_ssg_down_step | bool) }}
  when:
    - not (clickhouse.second_service.enabled | bool)
    - not (_ssg_teardown | bool)
  block:
    - name: Look for a kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: _ssg_kubeconfig
      check_mode: false

    - name: Look for the second service's ClickHouseCluster
      # --ignore-not-found: rc 0 and no output means it is not there. A
      # non-zero rc means the cluster could not be asked, or the operator's
      # CRD is not installed yet.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - clickhousecluster
          - c-{{ clickhouse.second_service.cluster_name }}
          - --namespace={{ clickhouse.second_service.namespace }}
          - --ignore-not-found
          - --request-timeout=20s
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _ssg_cr
      changed_when: false
      failed_when: false
      check_mode: false
      when: _ssg_kubeconfig.stat.exists

    - name: Look for the second service's Helm release
      # A release whose CR is already gone still counts: a later teardown of
      # it is what removes the namespace.
      ansible.builtin.command:
        argv:
          - helm
          - list
          - --namespace={{ clickhouse.second_service.namespace }}
          - --filter=^{{ clickhouse.second_service.cluster_name }}$
          - --short
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _ssg_release
      changed_when: false
      failed_when: false
      check_mode: false
      when: _ssg_kubeconfig.stat.exists

    - name: Ask AWS whether the EKS cluster is there, when the cluster did not answer
      # Both lookups failing with a kubeconfig on disk means either the EKS
      # cluster is gone (scripts/down.sh --all keeps state/kubeconfig) or it
      # could not be reached. Only the first is safe to pass.
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-cluster
          - --name={{ infrastructure.eks_cluster_name }}
          - --profile={{ aws.target_profile }}
          - --region={{ aws.target_region }}
          - --query=cluster.status
          - --output=text
      register: _ssg_eks
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _ssg_kubeconfig.stat.exists
        - (_ssg_cr.rc | default(1)) != 0
        - (_ssg_release.rc | default(1)) != 0

    - name: Stop if the cluster did not answer
      vars:
        _ssg_unanswered: "{{ _ssg_eks is not skipped }}"
        _ssg_no_eks: "{{ 'ResourceNotFoundException' in (_ssg_eks.stderr | default('')) }}"
        # The first line of what each tool said; msg when it could not even start.
        _ssg_kubectl_said: "{{ ((_ssg_cr.stderr | default('', true)) or (_ssg_cr.msg | default('nothing', true))) | trim | split('\\n') | first }}"
        _ssg_helm_said: "{{ ((_ssg_release.stderr | default('', true)) or (_ssg_release.msg | default('nothing', true))) | trim | split('\\n') | first }}"
      ansible.builtin.assert:
        that: not (_ssg_unanswered | bool) or (_ssg_no_eks | bool)
        fail_msg: >-
          clickhouse.second_service.enabled is false, so this run checks first that the
          second service is not still deployed, but the cluster in {{ kubeconfig_path }}
          did not answer: kubectl said '{{ _ssg_kubectl_said }}' and helm said
          '{{ _ssg_helm_said }}'.
          Without an answer it cannot tell, and this run would take away the second
          service's nodes, its access to the S3 data and the operator's private-Hydra flag
          if it is still there. Nothing has been changed. Check that your AWS credentials
          for {{ aws.target_profile }} are current and that the API endpoint of EKS cluster
          {{ infrastructure.eks_cluster_name }} can be reached, then re-run once the
          cluster answers (KUBECONFIG={{ kubeconfig_path }} kubectl get nodes is a quick test).
        quiet: true

    - name: Stop if the second service is still deployed
      vars:
        _ssg_found: >-
          {{ (['Helm release ' ~ clickhouse.second_service.cluster_name]
              if (_ssg_release.rc | default(1)) == 0 and (_ssg_release.stdout | default('') | trim) != '' else [])
             + (['ClickHouseCluster c-' ~ clickhouse.second_service.cluster_name]
                if (_ssg_cr.rc | default(1)) == 0 and (_ssg_cr.stdout | default('') | trim) != '' else []) }}
      ansible.builtin.assert:
        that: _ssg_found | length == 0
        fail_msg: >-
          clickhouse.second_service.enabled is false, but the second service is still
          deployed: {{ _ssg_found | join(' and ') }} in
          {{ clickhouse.second_service.namespace }}. This run would take away its nodes,
          its access to the S3 data and the operator's private-Hydra flag while it is
          still attached to c-{{ clickhouse.cluster_name }}, and without the flag the
          parent's replica cleanup can remove the second service's replicas from the
          shared Keeper. Nothing has been changed. To keep the second service, set
          clickhouse.second_service.enabled back to true (scripts/go.sh --second-service).
          To remove it, tear it down first, while the operator still runs with its flag:
          scripts/play.sh --tags second-lb -e second_lb_state=absent, then
          scripts/play.sh --tags second-service -e second_service_state=absent.
          Then re-run with the switch off.
        success_msg: >-
          {{ 'no kubeconfig yet, so no second service to find'
             if not _ssg_kubeconfig.stat.exists
             else ('no EKS cluster ' ~ infrastructure.eks_cluster_name ~ ', so no second service to find'
                   if _ssg_eks is not skipped
                   else 'no second service in ' ~ clickhouse.second_service.namespace) }}

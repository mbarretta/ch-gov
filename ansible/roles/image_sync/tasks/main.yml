---
# Copy container images and Helm charts from ClickHouse's ECR (and the few
# public registries the optional pieces need) into yours.
#
# This is the airgap hop. skopeo talks registry-to-registry, so layers never
# touch this machine -- no docker daemon, no multi-GB local round trip. The
# one exception is a chart published from a plain Helm HTTP repository
# (kind: helm-http in group_vars): skopeo has no OCI source to copy from, so
# it is pulled with helm into state/charts/ and pushed to ECR with helm.
#
# `--all` copies the full multi-arch manifest list rather than only the
# manifest matching this laptop's architecture. That matters: we run on arm64
# macOS, the standard build needs arm64 Linux, and the FIPS build needs
# x86_64. Without --all you can silently publish the wrong architecture.
#
# Note on style: these tasks deliberately avoid `shell:` with a pipeline.
# Piping `aws ecr get-login-password | skopeo login` inside a folded YAML
# scalar is fragile (indented continuation lines become real newlines and
# break the pipe), and a broken pipe dumps the registry token into the log.
# Passing the token via the command module's `stdin` keeps it out of argv
# and out of the process table.

- name: Ensure state directory exists for the skopeo auth file
  ansible.builtin.file:
    path: "{{ skopeo_authfile | dirname }}"
    state: directory
    mode: "0700"

# --- registry logins -------------------------------------------------------
# ECR tokens last 12h and are scoped to a single registry, so each side needs
# its own login. Both land in a project-local authfile (state/, gitignored).

- name: Request ECR tokens for both registries
  ansible.builtin.command:
    argv:
      - aws
      - ecr
      - get-login-password
      - --profile={{ item.profile }}
      - --region={{ item.region }}
  loop:
    - { name: source, profile: "{{ aws.source_ecr_profile }}", region: "{{ aws.source_ecr_region }}", registry: "{{ source_registry }}" }
    - { name: target, profile: "{{ aws.target_profile }}",     region: "{{ aws.target_region }}",     registry: "{{ target_registry }}" }
  loop_control:
    label: "{{ item.name }}"
  register: _ecr_tokens
  changed_when: false
  check_mode: false
  no_log: true          # stdout IS the credential

- name: Log in to each registry
  ansible.builtin.command:
    argv:
      - skopeo
      - login
      - --username=AWS
      - --password-stdin
      - --authfile={{ skopeo_authfile }}
      - "{{ item.item.registry }}"
    stdin: "{{ item.stdout }}"
  loop: "{{ _ecr_tokens.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.registry }}"
  register: _logins
  changed_when: false
  failed_when: false    # checked below, so we can report clearly
  check_mode: false
  no_log: true          # stdin carries the credential

- name: Verify both logins succeeded
  # Separate task so the diagnostic is readable. assert always dumps its
  # full result, and each loop item here is a login result whose own `item`
  # is the token task's result -- stdout included. The label below keeps the
  # per-item line clean, but only no_log keeps the token out of that dump.
  # fail_msg (rc and stderr, never the token) still surfaces on a failure;
  # -e show_secrets=true reveals the full result.
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      skopeo login failed for {{ item.item.item.name }} registry
      ({{ item.item.item.registry }}), rc={{ item.rc }}:
      {{ item.stderr | default('no stderr') }}
    success_msg: "logged in to {{ item.item.item.registry }}"
  loop: "{{ _logins.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

# --- the copy itself -------------------------------------------------------

- name: Check which tags already exist in the target registry
  # Makes the role idempotent and, more usefully, resumable: a sync
  # interrupted halfway continues instead of recopying gigabytes.
  ansible.builtin.command:
    argv:
      - aws
      - ecr
      - describe-images
      - --repository-name={{ item.repo }}
      - --image-ids=imageTag={{ item.tag }}
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
      - --query=imageDetails[0].imageDigest
      - --output=text
  loop: "{{ all_artifacts }}"
  loop_control:
    label: "{{ item.repo }}:{{ item.tag }}"
  register: _existing
  changed_when: false
  failed_when: false      # "not found" is an expected, meaningful answer
  check_mode: false

- name: Split the results by how each artifact is mirrored
  # Everything without a kind, and any kind other than helm-http, goes
  # registry-to-registry with skopeo. helm-http charts have no OCI source and
  # take the helm pull/push path at the end of this file. The `defined` guard
  # is not decoration: rejectattr('item.kind', 'equalto', ...) raises on the
  # entries that carry no kind at all, which is most of them.
  ansible.builtin.set_fact:
    _skopeo_results: >-
      {{ (_existing.results | rejectattr('item.kind', 'defined') | list)
         + (_existing.results | selectattr('item.kind', 'defined')
            | rejectattr('item.kind', 'equalto', 'helm-http') | list) }}
    _helm_http_missing: >-
      {{ _existing.results | selectattr('item.kind', 'defined')
         | selectattr('item.kind', 'equalto', 'helm-http')
         | selectattr('stdout', 'defined')
         | rejectattr('stdout', 'search', 'sha256:') | list }}

- name: Copy each artifact that is not already present
  ansible.builtin.command:
    argv:
      - skopeo
      - copy
      - --all
      - --authfile={{ skopeo_authfile }}
      # Most artifacts come from ClickHouse's ECR; a third-party mirror
      # entry overrides that with its own registry. skopeo needs no
      # credentials for a public source, and finds none in the authfile.
      # source_tag lets a floating upstream tag (Chainguard's `latest`) land
      # under our own fixed tag: ECR tags are immutable and the existence
      # check above skips present tags, so the digest is resolved once and
      # frozen until someone bumps the tag in group_vars.
      - "docker://{{ item.item.source | default(source_registry) }}/{{ item.item.repo }}:{{ item.item.source_tag | default(item.item.tag) }}"
      - "docker://{{ target_registry }}/{{ item.item.repo }}:{{ item.item.tag }}"
  loop: "{{ _skopeo_results }}"
  loop_control:
    label: "{{ item.item.repo }}:{{ item.item.tag }}"
  when: item.rc != 0 or 'sha256:' not in (item.stdout | default(''))
  register: _copied

- name: Report what was copied vs already present
  ansible.builtin.debug:
    msg: >-
      {{ _copied.results | rejectattr('skipped', 'defined') | list | length }} copied,
      {{ _copied.results | selectattr('skipped', 'defined') | list | length }} already present
      ({{ 'FIPS' if fips else 'standard' }} build);
      {{ _helm_http_missing | length }} chart(s) to push with helm

# --- charts from a plain Helm HTTP repository -------------------------------
# Only the Langfuse chart takes this path today, and only when its tag is not
# in ECR yet. `helm pull` writes <name>-<version>.tgz (subcharts bundled, so
# nothing else needs mirroring); `helm push` names the OCI target after the
# chart, so helm/<name> in ECR matches the repo ecr_setup created. The login
# block is the one clickhouse_operator uses -- same token, same discipline.

- name: Request an ECR token for helm
  ansible.builtin.command:
    argv:
      - aws
      - ecr
      - get-login-password
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  register: _helm_ecr_token
  changed_when: false
  check_mode: false
  no_log: true            # stdout IS the credential
  when: _helm_http_missing | length > 0

- name: Authenticate helm against ECR
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - --username=AWS
      - --password-stdin
      - "{{ target_registry }}"
    stdin: "{{ _helm_ecr_token.stdout }}"
  changed_when: false
  check_mode: false
  no_log: true            # stdin carries the credential
  when: _helm_http_missing | length > 0

- name: Ensure the local chart directory exists
  # Scratch space for the pulled .tgz. Under state/, so gitignored with the
  # rest, and 0700 like the other directories this role creates there.
  ansible.builtin.file:
    path: "{{ state_dir }}/charts"
    state: directory
    mode: "0700"
  when: _helm_http_missing | length > 0

- name: Pull each missing chart from its Helm repository
  ansible.builtin.command:
    argv:
      - helm
      - pull
      - "{{ item.item.repo | basename }}"
      - --repo={{ item.item.source }}
      - --version={{ item.item.tag }}
      - --destination={{ state_dir }}/charts
  loop: "{{ _helm_http_missing }}"
  loop_control:
    label: "{{ item.item.repo }}:{{ item.item.tag }}"
  changed_when: false     # a download into scratch space; the push is the change

- name: Push each pulled chart to ECR
  ansible.builtin.command:
    argv:
      - helm
      - push
      - "{{ state_dir }}/charts/{{ item.item.repo | basename }}-{{ item.item.tag }}.tgz"
      - "oci://{{ target_registry }}/{{ item.item.repo | dirname }}"
  loop: "{{ _helm_http_missing }}"
  loop_control:
    label: "{{ item.item.repo }}:{{ item.item.tag }}"

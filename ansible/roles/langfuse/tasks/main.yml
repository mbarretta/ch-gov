---
# Step 15: Langfuse itself -- the web and worker Deployments, plus an
# in-cluster PostgreSQL and Valkey on Chainguard images, all pulled from our
# ECR. Traces go to the ClickHouse Private cluster from Step 9 as the
# `langfuse` user Step 14 created; events, exports and media go to the Step 13
# bucket through IRSA on the chart's ServiceAccount. No access keys anywhere.
#
# Optional: deploy.yml runs this role only when langfuse.enabled is true (or
# on teardown). Steps 13 and 14 must have run first -- this role reads the
# IRSA role ARN from the Step 13 stack and the ClickHouse password Step 14
# wrote to state/.
#
# Order matters here more than in the other roles. NEXTAUTH_URL is baked into
# the web pods and NextAuth redirects the browser to it after login, so it
# must equal the address people type -- which means the load balancer is
# created and its hostname known BEFORE the Helm release. The Secrets the
# chart references by name must exist before the release, too.
#
# Exposure follows Step 12: langfuse.load_balancer.type none|internal|public,
# realised as a second NLB Service (langfuse-lb) in front of the web pods.
# Plain HTTP; no domain, no TLS.
#
# Cost: no new instances (everything lands on the operator node group);
# ~$0.02/hr for the NLB plus EBS pennies for the two small volumes.
#
# Secrets are hidden from the output. Re-run with -e show_secrets=true to see
# the Secret objects and the password-carrying execs when something fails.
#
# Teardown: ansible-playbook deploy.yml --tags lf-app -e langfuse_state=absent
#   Removes the NLB Service, the release and the namespace (with its PVCs).
#   The ClickHouse database and user are NOT touched -- that is Step 14's
#   teardown (--tags lf-db -e langfuse_db_state=absent), the "purge Langfuse
#   data" switch.

- name: Preconditions and inputs (skipped on teardown)
  # Everything the install needs to know or check. None of it applies when
  # removing Langfuse -- and checking it would make teardown impossible after
  # the ClickHouse cluster or the Step 13 stack are already gone.
  when: (langfuse_state | default('present')) != 'absent'
  block:
    # --- exposure --------------------------------------------------------------

    - name: Validate the load balancer type
      ansible.builtin.assert:
        that: langfuse.load_balancer.type in ['none', 'internal', 'public']
        fail_msg: "langfuse.load_balancer.type must be none, internal or public (got '{{ langfuse.load_balancer.type }}')"

    - name: Decide whether the load balancer Service should exist
      ansible.builtin.set_fact:
        _lf_present: "{{ langfuse.load_balancer.type != 'none' }}"

    - name: Resolve who may connect
      # The cloud controller turns loadBalancerSourceRanges into ingress rules on
      # the node security group, one per NodePort. Leave it empty and it writes
      # 0.0.0.0/0 -- for an internal NLB that is moot (private address), for a
      # public one it is the open internet. So it is never left empty here.
      ansible.builtin.set_fact:
        _lf_sources: >-
          {{ langfuse.load_balancer.allowed_cidrs
             if langfuse.load_balancer.allowed_cidrs | length > 0
             else ([infrastructure.vpc_cidr] if langfuse.load_balancer.type == 'internal' else []) }}

    - name: A public load balancer needs an explicit allow list
      ansible.builtin.assert:
        that:
          - _lf_sources | length > 0
          - "'0.0.0.0/0' not in _lf_sources or (allow_open_internet | default(false) | bool)"
        fail_msg: >-
          langfuse.load_balancer.type is 'public' but allowed_cidrs is
          {{ 'empty' if _lf_sources | length == 0 else 'the whole internet' }}.
          Set allowed_cidrs to the CIDRs that should reach Langfuse
          (your office/VPN egress, e.g. "203.0.113.7/32"). To really open port
          {{ langfuse.load_balancer.port }} to everyone, add -e allow_open_internet=true
          -- and note this is plain HTTP: TLS is not configured in this deployment.
      when: langfuse.load_balancer.type == 'public'

    # --- inputs from earlier steps ---------------------------------------------

    - name: Look for the ClickHouse password Step 14 generated
      ansible.builtin.stat:
        path: "{{ langfuse_state_files.clickhouse_password_file }}"
      register: _lf_ch_pw_file
      check_mode: false

    - name: Fail clearly if Step 14 has not run
      ansible.builtin.assert:
        that: _lf_ch_pw_file.stat.exists
        fail_msg: "{{ langfuse_state_files.clickhouse_password_file }} is missing. Run: ansible-playbook deploy.yml --tags lf-db"

    - name: Look up the IRSA role ARN from the Step 13 stack
      # Read from CloudFormation rather than a fact set by the langfuse_storage
      # role, so this works when run alone with --tags lf-app.
      amazon.aws.cloudformation_info:
        stack_name: "{{ infrastructure.environment_name }}-langfuse-irsa"
        region: "{{ aws.target_region }}"
        profile: "{{ aws.target_profile }}"
      register: _lf_irsa_info
      check_mode: false

    - name: Fail clearly if Step 13 has not run
      ansible.builtin.assert:
        that: (infrastructure.environment_name ~ '-langfuse-irsa') in _lf_irsa_info.cloudformation
        fail_msg: "No CloudFormation stack {{ infrastructure.environment_name }}-langfuse-irsa. Run: ansible-playbook deploy.yml --tags lf-storage"

    - name: Extract the role ARN
      ansible.builtin.set_fact:
        _lf_s3_role_arn: >-
          {{ _lf_irsa_info.cloudformation[infrastructure.environment_name ~ '-langfuse-irsa']
             .stack_outputs.LangfuseS3RoleArn }}

    - name: Read the ClickHouse passwords
      # The langfuse user's, for the Secret the chart reads; the admin's, for
      # the grants check below.
      ansible.builtin.set_fact:
        _lf_ch_pw: "{{ lookup('ansible.builtin.file', langfuse_state_files.clickhouse_password_file) }}"
        _lf_admin_pw: "{{ lookup('ansible.builtin.file', admin_password_file) }}"
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    # --- generated secrets -----------------------------------------------------

    - name: Ensure the state directory exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        mode: "0700"

    - name: Generate (or reuse) the application secrets
      # The password lookup writes the file on first use and reads it back on
      # every run after, so the Secrets below converge and helm sees no change.
      # ENCRYPTION_KEY must be 64 hex characters (256 bits). The API keys are
      # pk-lf-/sk-lf- plus 32 hex, the shape Langfuse generates itself; the
      # lookup (not the uuid filter, which changes every run) makes the hex.
      # hexdigits includes A-F, so the values are lower-cased; the prefix is
      # stripped before it is re-added because the files below are rewritten
      # with the prefixed key and read back by the lookup on the next run.
      ansible.builtin.set_fact:
        _lf_nextauth_secret: "{{ lookup('ansible.builtin.password', langfuse_state_files.nextauth_secret_file ~ ' length=32 chars=ascii_letters,digits') }}"
        _lf_salt: "{{ lookup('ansible.builtin.password', langfuse_state_files.salt_file ~ ' length=32 chars=ascii_letters,digits') }}"
        _lf_encryption_key: "{{ lookup('ansible.builtin.password', langfuse_state_files.encryption_key_file ~ ' length=64 chars=hexdigits') | lower }}"
        _lf_init_pw: "{{ lookup('ansible.builtin.password', langfuse_state_files.init_user_password_file ~ ' length=32 chars=ascii_letters,digits') }}"
        _lf_public_key: "pk-lf-{{ lookup('ansible.builtin.password', langfuse_state_files.public_key_file ~ ' length=32 chars=hexdigits') | regex_replace('^pk-lf-', '') | lower }}"
        _lf_secret_key: "sk-lf-{{ lookup('ansible.builtin.password', langfuse_state_files.secret_key_file ~ ' length=32 chars=hexdigits') | regex_replace('^sk-lf-', '') | lower }}"
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Store the secrets exactly as Langfuse sees them, owner-readable only
      # The lookup wrote the raw random part; rewrite each file with the value
      # the Secrets carry (lower-cased hex, prefixed API keys) so
      # scripts/langfuse-smoke.sh can read them verbatim. Idempotent: on the
      # next run the lookup returns this content and the normalisation above
      # changes nothing.
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0600"
      loop:
        - {dest: "{{ langfuse_state_files.nextauth_secret_file }}", content: "{{ _lf_nextauth_secret }}"}
        - {dest: "{{ langfuse_state_files.salt_file }}", content: "{{ _lf_salt }}"}
        - {dest: "{{ langfuse_state_files.encryption_key_file }}", content: "{{ _lf_encryption_key }}"}
        - {dest: "{{ langfuse_state_files.init_user_password_file }}", content: "{{ _lf_init_pw }}"}
        - {dest: "{{ langfuse_state_files.public_key_file }}", content: "{{ _lf_public_key }}"}
        - {dest: "{{ langfuse_state_files.secret_key_file }}", content: "{{ _lf_secret_key }}"}
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    # --- cluster mode ----------------------------------------------------------
    # Langfuse runs its ClickHouse migrations ON CLUSTER `default` when
    # CLICKHOUSE_CLUSTER_ENABLED is true (its default). That fits ClickHouse
    # Private (cluster `default`, cloud_mode, SharedMergeTree) -- unless the
    # server requires the CLUSTER grant for ON CLUSTER queries AND Step 14
    # could not grant it (the admin does not hold CLUSTER, so the GRANT is
    # attempted with failed_when: false there). In that one case the
    # migrations would be refused, and cluster mode goes off: the Shared
    # database engine replicates DDL anyway, so ON CLUSTER is not needed for
    # correctness. Decided here, from the live server, and printed.

    - name: List the running ClickHouse server pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace={{ clickhouse.namespace }}
          - --selector=app.kubernetes.io/name=clickhouse-server
          - --field-selector=status.phase=Running
          - -o=jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_server_pods
      changed_when: false
      check_mode: false

    - name: Fail clearly if the cluster is not there
      ansible.builtin.assert:
        that: _lf_server_pods.stdout_lines | length > 0
        fail_msg: "No ClickHouse server pod Running in {{ clickhouse.namespace }}. Run: ansible-playbook deploy.yml --tags cluster"

    - name: Prepare the exec
      # `kubectl exec -i`: the admin password travels on stdin, which kubectl
      # forwards into the container -- never on argv (see clickhouse_verify
      # for the full reasoning, including why the client gets /dev/null).
      ansible.builtin.set_fact:
        _lf_exec: ["kubectl", "exec", "-i", "--namespace={{ clickhouse.namespace }}", "-c", "c-{{ clickhouse.cluster_name }}-server", "{{ _lf_server_pods.stdout_lines[0] }}", "--", "sh", "-c"]
        _lf_sh: 'IFS= read -r pw; exec clickhouse-client --user "$0" --password "$pw" --multiquery --query "$1" </dev/null'
        # A server setting (access_control_improvements). Which system table
        # lists it differs between versions, so both are asked; an empty answer
        # means the server does not report it, i.e. it is not enforced.
        _lf_setting_sql: >-
          SELECT value FROM system.settings WHERE name = 'on_cluster_queries_require_cluster_grant'
          UNION ALL
          SELECT value FROM system.server_settings WHERE name = 'on_cluster_queries_require_cluster_grant'
          FORMAT TSV

    - name: Read the grants Step 14 gave the Langfuse user
      ansible.builtin.command:
        argv: "{{ _lf_exec + [_lf_sh, clickhouse.admin_username, 'SHOW GRANTS FOR ' ~ langfuse.clickhouse_user ~ ' FORMAT TSV'] }}"
        stdin: "{{ _lf_admin_pw }}\n"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_grants
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Fail clearly if Step 14 has not created the user
      ansible.builtin.assert:
        that: _lf_grants.rc == 0
        fail_msg: "SHOW GRANTS FOR {{ langfuse.clickhouse_user }} failed (rc {{ _lf_grants.rc }}): {{ _lf_grants.stderr | default('') | trim }}. Run: ansible-playbook deploy.yml --tags lf-db"

    - name: Ask whether ON CLUSTER queries need the CLUSTER grant
      ansible.builtin.command:
        argv: "{{ _lf_exec + [_lf_sh, clickhouse.admin_username, _lf_setting_sql] }}"
        stdin: "{{ _lf_admin_pw }}\n"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_setting
      changed_when: false
      check_mode: false
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Collect the inputs to the decision
      ansible.builtin.set_fact:
        _lf_has_cluster_grant: "{{ _lf_grants.stdout is search('GRANT CLUSTER ON') }}"
        _lf_requires_cluster_grant: "{{ (_lf_setting.stdout_lines | first | default('')) | trim == '1' }}"
        _lf_setting_value: "{{ (_lf_setting.stdout | trim) or 'not reported' }}"

    - name: Decide the cluster mode
      ansible.builtin.set_fact:
        _lf_cluster_enabled: "{{ (_lf_has_cluster_grant | bool) or not (_lf_requires_cluster_grant | bool) }}"

    - name: Report the cluster-mode decision
      ansible.builtin.debug:
        msg:
          - "CLUSTER granted to {{ langfuse.clickhouse_user }}:        {{ _lf_has_cluster_grant }}"
          - "on_cluster_queries_require_cluster_grant: {{ _lf_setting_value }}"
          - "clickhouse.cluster.enabled:               {{ _lf_cluster_enabled }}{{ '' if _lf_cluster_enabled else '  (migrations run without ON CLUSTER; the Shared database engine replicates DDL)' }}"

# --- teardown ---------------------------------------------------------------
# Here, before anything is built, the way clickhouse_loadbalancer places its
# own: with langfuse_state=absent the install flow below never runs (the facts
# it uses were never set), and nothing here needs the ClickHouse cluster or
# the Step 13 stack to still exist. Order matters. The load balancer Service
# goes first -- deleting it is what deletes the NLB and its security-group
# rules -- then the release, then the namespace, which takes the two
# PersistentVolumeClaims and so the EBS volumes with it. The ClickHouse
# database and user are deliberately left alone (see the header).

- name: Teardown (langfuse_state=absent)
  when: (langfuse_state | default('present')) == 'absent'
  block:
    - name: Remove the load balancer Service
      # The cloud controller removes the NLB when the Service goes, and the
      # Service stays until that finalizer clears. Takes ~1 minute.
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Service
        name: langfuse-lb
        namespace: "{{ langfuse.namespace }}"
        state: absent
        wait: true
        wait_timeout: 120

    - name: Uninstall the release
      # wait: returns once the release's resources are gone. The PostgreSQL
      # StatefulSet's volume claim and the chart's generated Secrets
      # (helm.sh/resource-policy: keep) outlive the release by design and go
      # with the namespace below.
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ langfuse.release }}"
        release_namespace: "{{ langfuse.namespace }}"
        release_state: absent
        wait: true

    - name: Remove the namespace and everything left in it
      # The PVCs go with the namespace and the EBS CSI driver releases the
      # volumes; the namespace stays Terminating until that is done.
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Namespace
        name: "{{ langfuse.namespace }}"
        state: absent
        wait: true
        wait_timeout: 300

    - name: Teardown summary
      ansible.builtin.debug:
        msg:
          - "Langfuse removed: Service langfuse-lb (and its NLB), release {{ langfuse.release }}, namespace {{ langfuse.namespace }} with its PersistentVolumeClaims -- the PostgreSQL and Valkey volumes are gone"
          - "the ClickHouse database {{ langfuse.clickhouse_database }} and user {{ langfuse.clickhouse_user }} are kept; purge them with --tags lf-db -e langfuse_db_state=absent"
          - "the Step 13 bucket and IRSA stack are not touched (--tags lf-storage -e langfuse_storage_state=absent); the generated secrets under {{ state_dir | realpath }} are kept and reused by the next --tags lf-app"

    - name: Stop here when tearing down
      ansible.builtin.meta: end_play

# --- namespace and Secrets ---------------------------------------------------
# Created by Ansible rather than the chart: the chart references them by name
# (existingSecret / secretKeyRef / secretRef), so they must exist before the
# release. Written as data: with b64encode, not stringData -- with stringData
# the server re-encodes and every apply would report a change.

- name: Create the namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ langfuse.namespace }}"
        labels:
          app.kubernetes.io/managed-by: clickhouse-private-ansible

- name: Write the application Secret (NextAuth secret, salt, encryption key)
  # Not `langfuse-app`: chart 2.1.0 renders a Secret of exactly that name
  # (templates/langfuse-app-secret.yaml, <fullname>-app) to hold whichever of
  # these three it has to generate itself, and Helm refuses to install over an
  # object it does not own. So this one takes the chart's own naming for
  # credential Secrets (-auth, as in langfuse-postgresql-auth) and the chart's
  # langfuse-app ends up empty, since every value below is provided.
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: langfuse-app-auth
        namespace: "{{ langfuse.namespace }}"
        labels:
          app.kubernetes.io/managed-by: clickhouse-private-ansible
      type: Opaque
      data:
        nextauth-secret: "{{ _lf_nextauth_secret | b64encode }}"
        salt: "{{ _lf_salt | b64encode }}"
        encryption-key: "{{ _lf_encryption_key | b64encode }}"
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

- name: Write the ClickHouse Secret (the langfuse user's password from Step 14)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: langfuse-clickhouse
        namespace: "{{ langfuse.namespace }}"
        labels:
          app.kubernetes.io/managed-by: clickhouse-private-ansible
      type: Opaque
      data:
        password: "{{ _lf_ch_pw | b64encode }}"
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

- name: Write the headless-init Secret (org, project, user, API keys)
  # Mounted as environment via additionalEnvFrom. Langfuse reads the
  # LANGFUSE_INIT_* variables on first boot and seeds the org, project, user
  # and API key pair, so the demo works without clicking through sign-up.
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: langfuse-init
        namespace: "{{ langfuse.namespace }}"
        labels:
          app.kubernetes.io/managed-by: clickhouse-private-ansible
      type: Opaque
      data:
        LANGFUSE_INIT_ORG_ID: "{{ langfuse.init.org_id | b64encode }}"
        LANGFUSE_INIT_ORG_NAME: "{{ langfuse.init.org_name | b64encode }}"
        LANGFUSE_INIT_PROJECT_ID: "{{ langfuse.init.project_id | b64encode }}"
        LANGFUSE_INIT_PROJECT_NAME: "{{ langfuse.init.project_name | b64encode }}"
        LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "{{ _lf_public_key | b64encode }}"
        LANGFUSE_INIT_PROJECT_SECRET_KEY: "{{ _lf_secret_key | b64encode }}"
        LANGFUSE_INIT_USER_EMAIL: "{{ langfuse.init.user_email | b64encode }}"
        LANGFUSE_INIT_USER_NAME: "{{ langfuse.init.user_name | b64encode }}"
        LANGFUSE_INIT_USER_PASSWORD: "{{ _lf_init_pw | b64encode }}"
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

# --- the load balancer -------------------------------------------------------
# Before the release, because NEXTAUTH_URL is derived from its hostname. Same
# manifest shape as Step 12's Service; the selector is the chart's own web
# selector (templates/web/service.yaml), so the Service finds the web pods
# the moment the release creates them.

- name: Create or update the load balancer Service
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: langfuse-lb
        namespace: "{{ langfuse.namespace }}"
        labels:
          app.kubernetes.io/managed-by: clickhouse-private-ansible
          app.kubernetes.io/part-of: langfuse
        annotations: >-
          {{ {
            'service.beta.kubernetes.io/aws-load-balancer-type': 'nlb',
            'service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled':
              langfuse.load_balancer.cross_zone | bool | string | lower
          } | combine(
            {'service.beta.kubernetes.io/aws-load-balancer-internal': 'true'}
            if langfuse.load_balancer.type == 'internal' else {}
          ) }}
      spec:
        type: LoadBalancer
        selector:
          app.kubernetes.io/name: langfuse
          app.kubernetes.io/instance: "{{ langfuse.release }}"
          app: web
        # Local: traffic reaches a node and goes to the web pod ON that node,
        # no second hop, client IP preserved. Nodes without a web pod fail the
        # health check and take no traffic -- expected, not a partial failure.
        externalTrafficPolicy: Local
        loadBalancerSourceRanges: "{{ _lf_sources }}"
        ports:
          - name: http
            protocol: TCP
            port: "{{ langfuse.load_balancer.port | int }}"
            targetPort: 3000
  when: _lf_present

- name: Wait for the cloud controller to assign a hostname
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - service
      - langfuse-lb
      - --namespace={{ langfuse.namespace }}
      - -o=jsonpath={.status.loadBalancer.ingress[0].hostname}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _lf_lb_host
  until: _lf_lb_host.stdout | trim | length > 0
  retries: 24
  delay: 5
  changed_when: false
  check_mode: false
  when: _lf_present

- name: Note the load balancer hostname and the web Service name
  ansible.builtin.set_fact:
    _lf_host: "{{ (_lf_lb_host.stdout | default('')) | trim }}"
    # The chart's ClusterIP Service in front of the web pods, named after
    # Helm's fullname: the release name when it contains the chart name
    # (langfuse), <release>-langfuse otherwise.
    _lf_fullname: "{{ langfuse.release if 'langfuse' in langfuse.release else langfuse.release ~ '-langfuse' }}"
    _lf_web_svc: "{{ (langfuse.release if 'langfuse' in langfuse.release else langfuse.release ~ '-langfuse') ~ '-web' }}"

- name: Settle the address people will use
  # NEXTAUTH_URL. langfuse.url if set; else the NLB hostname, with the port
  # appended only when it is not 80; else, with no load balancer,
  # http://localhost:3000 -- what a port-forward of exactly 3000:3000 to
  # svc/langfuse-web gives you (NextAuth redirects the browser here, so the
  # local port cannot be anything else).
  ansible.builtin.set_fact:
    _lf_url: >-
      {{ langfuse.url if langfuse.url
         else ('http://' ~ _lf_host ~ ('' if (langfuse.load_balancer.port | int) == 80 else ':' ~ langfuse.load_balancer.port))
         if _lf_present else 'http://localhost:3000' }}

- name: Report the address
  ansible.builtin.debug:
    msg: "NEXTAUTH_URL: {{ _lf_url }}{{ '' if _lf_present else '  (no load balancer: kubectl port-forward -n ' ~ langfuse.namespace ~ ' svc/' ~ _lf_web_svc ~ ' 3000:3000)' }}"

# --- the release -------------------------------------------------------------

- name: Log in to the ECR Helm registry
  ansible.builtin.command:
    argv:
      - aws
      - ecr
      - get-login-password
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  register: _lf_ecr_token
  changed_when: false
  check_mode: false
  no_log: true            # stdout IS the credential

- name: Authenticate helm against ECR
  ansible.builtin.command:
    argv:
      - helm
      - registry
      - login
      - --username=AWS
      - --password-stdin
      - "{{ target_registry }}"
    stdin: "{{ _lf_ecr_token.stdout }}"
  changed_when: false
  check_mode: false
  no_log: true            # stdin carries the credential

- name: Install or upgrade Langfuse
  # The chart from our ECR (Step 2 pushed it there). Every image below points
  # at our registry too: the chart's defaults are docker.langfuse.com,
  # docker.io and cgr.dev, none of which the cluster can reach.
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ langfuse.release }}"
    chart_ref: "oci://{{ target_registry }}/helm/langfuse"
    chart_version: "{{ versions.langfuse_chart }}"
    release_namespace: "{{ langfuse.namespace }}"
    # No helm wait: on the Chainguard image the subchart never creates the
    # langfuse PostgreSQL role, so web and worker crash-loop until that role
    # is created after the install, and helm's own wait would only time out.
    wait: false
    # Helm 4 applies server-side; see clickhouse_cluster for why the flag.
    force_conflicts: true
    values:
      langfuse:
        nextauth:
          url: "{{ _lf_url }}"
          secret:
            secretKeyRef: {name: langfuse-app-auth, key: nextauth-secret}
        salt:
          secretKeyRef: {name: langfuse-app-auth, key: salt}
        encryptionKey:
          secretKeyRef: {name: langfuse-app-auth, key: encryption-key}
        features:
          telemetryEnabled: "{{ langfuse.telemetry_enabled | bool }}"
          signUpDisabled: "{{ langfuse.signup_disabled | bool }}"
        serviceAccount:
          create: true
          annotations:
            # The IRSA wiring. Pods running as the chart's ServiceAccount
            # (named after the release; Step 13's trust policy names it) get
            # AWS_ROLE_ARN and a projected token from this one annotation.
            eks.amazonaws.com/role-arn: "{{ _lf_s3_role_arn }}"
        additionalEnvFrom:
          - secretRef: {name: langfuse-init}
        image:
          pullPolicy: IfNotPresent   # tags are immutable in our ECR
        web:
          image:
            repository: "{{ target_registry }}/langfuse/langfuse"
            tag: "{{ versions.langfuse_app }}"
          replicas: "{{ langfuse.web.replicas | int }}"
          resources:
            limits:   {cpu: "{{ langfuse.web.cpu }}", memory: "{{ langfuse.web.memory }}"}
            requests: {cpu: "{{ langfuse.web.cpu }}", memory: "{{ langfuse.web.memory }}"}
        worker:
          image:
            repository: "{{ target_registry }}/langfuse/langfuse-worker"
            tag: "{{ versions.langfuse_app }}"
          replicas: "{{ langfuse.worker.replicas | int }}"
          resources:
            limits:   {cpu: "{{ langfuse.worker.cpu }}", memory: "{{ langfuse.worker.memory }}"}
            requests: {cpu: "{{ langfuse.worker.cpu }}", memory: "{{ langfuse.worker.memory }}"}

      # The OLAP store: ClickHouse Private from Step 9, over the pod network
      # through the operator's server-any Service. Nothing is deployed here.
      clickhouse:
        deploy: false
        host: "c-{{ clickhouse.cluster_name }}-server-any.{{ clickhouse.namespace }}.svc.cluster.local"
        httpPort: 8123
        nativePort: 9000
        database: "{{ langfuse.clickhouse_database }}"
        auth:
          username: "{{ langfuse.clickhouse_user }}"
          existingSecret: langfuse-clickhouse
          existingSecretKey: password
        cluster:
          enabled: "{{ _lf_cluster_enabled | bool }}"   # decided above
        migration:
          ssl: false
          autoMigrate: true

      # PostgreSQL: the bundled subchart on Chainguard's image. Its postgres
      # user is uid 70 (the subchart assumes 999), so the security contexts
      # say so, or the volume is unwritable. The chart generates the
      # langfuse-postgresql-auth Secret itself.
      postgresql:
        deploy: true
        image:
          registry: "{{ target_registry }}"
          repository: chainguard/postgres
          tag: "{{ versions.chainguard_postgres_tag }}"
        podSecurityContext:
          fsGroup: 70
        securityContext:
          runAsUser: 70
          runAsGroup: 70
        storage:
          requestedSize: "{{ langfuse.postgres.disk }}"
          className: "{{ clickhouse.storage_class }}"
        resources:
          limits:   {cpu: "{{ langfuse.postgres.cpu }}", memory: "{{ langfuse.postgres.memory }}"}
          requests: {cpu: "{{ langfuse.postgres.cpu }}", memory: "{{ langfuse.postgres.memory }}"}

      # Valkey (the chart calls it redis): the bundled subchart on Chainguard's
      # -dev image, which has the /bin/sh its init container needs. uid 65532
      # (the subchart assumes 1000). The chart generates langfuse-redis-auth.
      redis:
        deploy: true
        image:
          registry: "{{ target_registry }}"
          repository: chainguard/valkey
          tag: "{{ versions.chainguard_valkey_tag }}"
        podSecurityContext:
          fsGroup: 65532
          runAsUser: 65532
          runAsGroup: 65532
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
        dataStorage:
          enabled: true
          requestedSize: "{{ langfuse.valkey.disk }}"
          className: "{{ clickhouse.storage_class }}"
        resources:
          limits:   {cpu: "{{ langfuse.valkey.cpu }}", memory: "{{ langfuse.valkey.memory }}"}
          requests: {cpu: "{{ langfuse.valkey.cpu }}", memory: "{{ langfuse.valkey.memory }}"}
        # The chart's default, restated because Langfuse requires it: the
        # queue must never lose entries to eviction.
        valkeyConfig: "maxmemory-policy noeviction"

      # Blob storage: the Step 13 bucket. No keys -- with none given the chart
      # omits the *_ACCESS_KEY* variables and the SDK uses the IRSA token.
      s3:
        deploy: false
        bucket: "{{ langfuse.bucket_name }}"
        region: "{{ aws.target_region }}"
        forcePathStyle: false
        eventUpload:
          prefix: "events/"
        batchExport:
          enabled: true
          prefix: "exports/"
        mediaUpload:
          enabled: true
          prefix: "media/"

# --- PostgreSQL role fix, then the waits -------------------------------------
# The subchart ships a first-boot script that creates the `langfuse` role and
# hands it the database. It mounts that script at /docker-entrypoint-initdb.d;
# Chainguard's entrypoint reads /var/lib/postgres/initdb/ instead, so on this
# image the script never runs, and web and worker crash-loop on "password
# authentication failed" until the role exists. So: wait for PostgreSQL, do
# what the script would have done, then wait for the rest. All of it sits in
# one block whose rescue shows the pods, the Warning events and the web and
# worker logs -- where the cause of a stuck rollout is actually written.

- name: Wait for the data stores, repair the PostgreSQL role, wait for the app
  block:
    - name: Wait for the PostgreSQL and Valkey pods to exist
      # helm returned without waiting; the StatefulSet and Deployment
      # controllers create the pods a moment later.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace={{ langfuse.namespace }}
          - --selector=app.kubernetes.io/instance={{ langfuse.release }},app.kubernetes.io/name={{ item }}
          - -o=name
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: [postgresql, redis]
      register: _lf_data_pods
      until: _lf_data_pods.stdout_lines | length > 0
      retries: 24
      delay: 5
      changed_when: false
      check_mode: false

    - name: Wait for PostgreSQL and Valkey to be Ready
      # Image pull, then initdb on the fresh volume (~30 s). The subcharts'
      # readiness probes are pg_isready and valkey-cli ping, so Ready means
      # "accepting connections".
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace={{ langfuse.namespace }}
          - --for=condition=Ready
          - --timeout=600s
          - pod
          - --selector=app.kubernetes.io/instance={{ langfuse.release }},app.kubernetes.io/name={{ item }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: [postgresql, redis]
      changed_when: false
      check_mode: false

    - name: Name the data-store pods
      # `pod/<name>`, the form kubectl exec accepts as-is.
      ansible.builtin.set_fact:
        _lf_pg_pod: "{{ _lf_data_pods.results[0].stdout_lines | first }}"
        _lf_valkey_pod: "{{ _lf_data_pods.results[1].stdout_lines | first }}"

    - name: Create the langfuse PostgreSQL role (what the skipped init script would have done)
      # `kubectl exec -i`: the SQL travels on stdin. The role's password never
      # leaves the pod: USERDB_PASSWORD is in the container's environment,
      # wired by the subchart from the Secret langfuse-postgresql-auth the
      # chart generated, and psql reads it with \getenv -- not from psql's
      # argv, where `ps` in the pod would show it. The superuser password
      # rides the same way (PGPASSWORD from POSTGRES_PASSWORD), so the
      # connection does not depend on pg_hba trusting local sockets. A DO
      # block cannot see psql variables, hence the session setting in
      # between. `langfuse` is the chart's default database and role name
      # (postgresql.auth.*), which the values above leave alone; the subchart
      # puts the same two values in POSTGRES_DB and USERDB_USER. The marker is
      # computed before the CREATE so it says what happened; GRANT and ALTER
      # are idempotent and simply run every time.
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -i
          - --namespace={{ langfuse.namespace }}
          - "{{ _lf_pg_pod }}"
          - --
          - sh
          - -c
          - ': "${USERDB_PASSWORD:?not in the pod environment}"; PGPASSWORD="$POSTGRES_PASSWORD" exec psql -X -q -t -A -v ON_ERROR_STOP=1 -h localhost -U postgres -d langfuse'
        stdin: |
          \getenv pw USERDB_PASSWORD
          SELECT set_config('lf.pw', :'pw', false) AS pw_set \gset
          SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'langfuse')
                      THEN 'role: exists' ELSE 'role: created' END;
          DO $lf$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'langfuse') THEN
              EXECUTE format('CREATE ROLE langfuse LOGIN PASSWORD %L', current_setting('lf.pw'));
            END IF;
          END
          $lf$;
          GRANT ALL ON DATABASE langfuse TO langfuse;
          ALTER DATABASE langfuse OWNER TO langfuse;
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_pg_role
      changed_when: "'role: created' in _lf_pg_role.stdout"
      check_mode: false
      # psql echoes a failing statement with its text -- here possibly the
      # CREATE ROLE with the password in it.
      no_log: "{{ not (show_secrets | default(false) | bool) }}"

    - name: Wait for the web, then the worker Deployment to be available
      # The web pods run the PostgreSQL and ClickHouse migrations on start-up,
      # and the pods that crash-looped before the role existed come back on
      # the kubelet's backoff (up to five minutes between restarts), so this
      # is patient. rollout status returns once the Deployment is Available.
      # By name, not --selector: the chart puts `app: web` on the pod template
      # only, so a label selector on the Deployments matches nothing, and
      # `rollout status` then prints "No resources found" and exits 0 -- a
      # wait that never waited (seen live). A missing Deployment by name is a
      # loud "not found" instead.
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/{{ _lf_fullname }}-{{ item }}
          - --namespace={{ langfuse.namespace }}
          - --timeout=900s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: [web, worker]
      changed_when: false
      check_mode: false

  rescue:
    - name: Show every pod in the namespace
      ansible.builtin.command:
        argv: [kubectl, get, pods, "--namespace={{ langfuse.namespace }}", -o=wide]
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_rescue_pods
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show the scheduler's and kubelet's reasons
      # Warning events carry the actual cause: an image that cannot be
      # pulled, a volume that will not attach, a probe that keeps failing.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - events
          - --namespace={{ langfuse.namespace }}
          - --field-selector=type=Warning
          - --sort-by=.lastTimestamp
          - -o=custom-columns=LAST:.lastTimestamp,OBJECT:.involvedObject.name,REASON:.reason,MESSAGE:.message
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: _lf_rescue_events
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Show the web and worker logs
      # For a crash-looping container this is the last attempt's output --
      # the migration error or the refused login, in Langfuse's own words.
      ansible.builtin.command:
        argv:
          - kubectl
          - logs
          - --namespace={{ langfuse.namespace }}
          - --selector=app.kubernetes.io/instance={{ langfuse.release }},app={{ item }}
          - --tail=40
          - --prefix
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: [web, worker]
      register: _lf_rescue_logs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Langfuse did not come up
      # Only the failed task's name and its one-line message: no_log does not
      # censor ansible_failed_result, and the role-fix task's output can carry
      # the password.
      ansible.builtin.fail:
        msg:
          - "failed at: {{ ansible_failed_task.name }} -- {{ ansible_failed_result.msg | default('') }}"
          - "--- pods ---"
          - "{{ _lf_rescue_pods.stdout_lines | default([]) }}"
          - "--- warning events (newest last) ---"
          - "{{ _lf_rescue_events.stdout_lines | default([]) }}"
          - "--- web log tail ---"
          - "{{ _lf_rescue_logs.results[0].stdout_lines | default([]) }}"
          - "--- worker log tail ---"
          - "{{ _lf_rescue_logs.results[1].stdout_lines | default([]) }}"
          - "The release is still installed; fix the cause and re-run --tags lf-app, or tear down with -e langfuse_state=absent."

# --- prove it -----------------------------------------------------------------

- name: List every container image in the namespace
  # Init containers too: the subcharts' first-boot helpers pull images as well.
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --namespace={{ langfuse.namespace }}
      - -o=jsonpath={range .items[*]}{range .spec.initContainers[*]}{.image}{"\n"}{end}{range .spec.containers[*]}{.image}{"\n"}{end}{end}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _lf_images
  changed_when: false
  check_mode: false

- name: Assert no container pulls from outside your registry
  ansible.builtin.assert:
    that: _lf_images.stdout_lines | reject('search', '^' ~ target_registry) | list | length == 0
    fail_msg: >-
      These Langfuse containers do not come from {{ target_registry }}:
      {{ _lf_images.stdout_lines | reject('search', '^' ~ target_registry) | list | join(', ') }}.
      Each one needs a Helm override and a mirrored image.
    success_msg: >-
      all {{ _lf_images.stdout_lines | length }} containers in {{ langfuse.namespace }}
      pull from {{ target_registry }}

- name: Read the PostgreSQL and Valkey versions
  ansible.builtin.command:
    argv: [kubectl, exec, "--namespace={{ langfuse.namespace }}", "{{ item.pod }}", --, "{{ item.binary }}", --version]
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  loop:
    - {pod: "{{ _lf_pg_pod }}", binary: postgres}
    - {pod: "{{ _lf_valkey_pod }}", binary: valkey-server}
  loop_control:
    label: "{{ item.binary }}"
  register: _lf_versions
  changed_when: false
  check_mode: false

- name: The data stores are the major versions the images were mirrored for
  # "postgres (PostgreSQL) 18.6" and "Valkey server v=9.1.2 ...". The majors
  # are the first run of digits in the mirrored tags (pg18-cg -> 18,
  # valkey9-cg-dev -> 9), so this follows `versions`.
  ansible.builtin.assert:
    that:
      - _lf_versions.results[0].stdout is search('PostgreSQL\) ' ~ (versions.chainguard_postgres_tag | regex_search('[0-9]+')) ~ '\.')
      - _lf_versions.results[1].stdout is search('v=' ~ (versions.chainguard_valkey_tag | regex_search('[0-9]+')) ~ '\.')
    fail_msg: "{{ _lf_versions.results | map(attribute='stdout') | map('trim') | join(' / ') }}"
    success_msg: "{{ _lf_versions.results | map(attribute='stdout') | map('trim') | join(' / ') }}"

- name: Ask ClickHouse what the migrations created
  # The web pods ran them before they went Ready. Same exec as the
  # cluster-mode check above, as the admin.
  ansible.builtin.command:
    argv: "{{ _lf_exec + [_lf_sh, clickhouse.admin_username, _q] }}"
    stdin: "{{ _lf_admin_pw }}\n"
  vars:
    _q: "SELECT concat(name, '=', engine) FROM system.tables WHERE database = '{{ langfuse.clickhouse_database }}' ORDER BY name FORMAT TSV"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _lf_ch_tables
  changed_when: false
  check_mode: false
  no_log: "{{ not (show_secrets | default(false) | bool) }}"

- name: The migrations landed, on the shared engine
  # Langfuse declares traces, observations and scores as ReplacingMergeTree;
  # ClickHouse Private (cloud_mode) creates every MergeTree-family table as
  # Shared*MergeTree -- the S3-backed, Keeper-coordinated engine -- so the
  # check is for that prefix. A plain MergeTree here would be a table on one
  # replica's local disk that the others cannot read.
  ansible.builtin.assert:
    that:
      - _lf_ch_tables.stdout_lines | length > 0
      - _lf_ch_missing | length == 0
      - _lf_ch_unshared | length == 0
    fail_msg: >-
      database {{ langfuse.clickhouse_database }}: {{ _lf_ch_tables.stdout_lines | length }} table(s);
      {{ 'missing: ' ~ (_lf_ch_missing | join(', ')) ~ '; ' if _lf_ch_missing | length > 0 else '' }}
      {{ 'not on a Shared*MergeTree engine: ' ~ (_lf_ch_unshared | join(', ')) if _lf_ch_unshared | length > 0 else '' }}
    success_msg: >-
      database {{ langfuse.clickhouse_database }}: {{ _lf_ch_tables.stdout_lines | length }} tables,
      {{ _lf_ch_core_lines | join(', ') }}
  vars:
    _lf_ch_core: [traces, observations, scores]
    _lf_ch_core_lines: "{{ _lf_ch_tables.stdout_lines | select('match', '^(' ~ (_lf_ch_core | join('|')) ~ ')=') | list }}"
    _lf_ch_missing: "{{ _lf_ch_core | difference(_lf_ch_core_lines | map('regex_replace', '=.*$', '') | list) }}"
    _lf_ch_unshared: "{{ _lf_ch_core_lines | reject('search', '=Shared\\w*MergeTree$') | list }}"

# --- the load balancer's view (skipped when type is none) ----------------------
# Copied from Step 12: find the NLB behind the hostname, then wait for its
# target group to see the web pod. Instance targets: every node is registered
# and only the ones running a web pod answer the health-check NodePort, so
# "healthy >= web replicas" is the steady state, not a partial failure.

- name: Find the NLB behind that hostname
  ansible.builtin.command:
    argv:
      - aws
      - elbv2
      - describe-load-balancers
      - --query=LoadBalancers[?DNSName=='{{ _lf_host }}'].LoadBalancerArn | [0]
      - --output=text
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  register: _lf_lb_arn
  until: _lf_lb_arn.stdout | trim not in ['', 'None']
  retries: 12
  delay: 5
  changed_when: false
  check_mode: false
  when: _lf_present

- name: List the target groups (one, for the http port)
  ansible.builtin.command:
    argv:
      - aws
      - elbv2
      - describe-target-groups
      - --load-balancer-arn={{ _lf_lb_arn.stdout | trim }}
      - --query=TargetGroups[].TargetGroupArn
      - --output=text
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  register: _lf_lb_tgs
  changed_when: false
  check_mode: false
  when: _lf_present

- name: Wait for the web node(s) to pass the NLB health check
  ansible.builtin.command:
    argv:
      - aws
      - elbv2
      - describe-target-health
      - --target-group-arn={{ item }}
      - --query=length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])
      - --output=text
      - --profile={{ aws.target_profile }}
      - --region={{ aws.target_region }}
  loop: "{{ _lf_lb_tgs.stdout.split() if _lf_present else [] }}"
  register: _lf_lb_health
  until: (_lf_lb_health.stdout | trim | int) >= (langfuse.web.replicas | int)
  retries: 30
  delay: 10
  changed_when: false
  check_mode: false
  when: _lf_present

# --- the health check ---------------------------------------------------------
# From a pod on the operator nodes, with the mirrored server image for its
# wget (the same probe Step 12 uses). Through the web Service is the hard
# check: that is Langfuse answering. Through the NLB is a soft one: with
# externalTrafficPolicy Local a node cannot reach its own web pod through the
# NLB (the hairpin), so the probe prefers a node without one -- preferred,
# not required, or with a web pod on every operator node it would never
# schedule -- and the outcome is reported rather than asserted. A fresh NLB
# also drops connections for a minute or two, hence the retries.

- name: Probe Langfuse from inside the cluster (and through the NLB when there is one)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      kubectl delete pod lf-probe --namespace={{ langfuse.namespace }} --ignore-not-found --wait >/dev/null
      kubectl apply -f - >/dev/null <<'YAML'
      apiVersion: v1
      kind: Pod
      metadata: {name: lf-probe, namespace: {{ langfuse.namespace }}}
      spec:
        restartPolicy: Never
        affinity:
          nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: clickhouseGroup, operator: DoesNotExist}]}]}}
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector: {matchLabels: {app.kubernetes.io/instance: {{ langfuse.release }}, app: web}}
        containers:
          - name: probe
            image: {{ target_registry }}/clickhouse-server:{{ versions.server }}{{ fips_suffix }}
            env:
              - {name: WEB, value: "http://{{ _lf_web_svc }}:3000"}
              - {name: NLB, value: "{{ _lf_url if _lf_present else '' }}"}
            command: ["sh", "-c"]
            args:
              - |
                code() { c=$(wget -qS -O /dev/null --timeout=5 --tries=1 "$1" 2>&1 | awk '/^ *HTTP\//{print $2; exit}'); echo "${c:-none}"; }
                echo "health: $(code "$WEB/api/public/health")"
                if [ -n "$NLB" ]; then echo "nlb: $(code "$NLB/api/public/health")"; fi
      YAML
      kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/lf-probe --namespace={{ langfuse.namespace }} --timeout=120s >/dev/null
      kubectl logs pod/lf-probe --namespace={{ langfuse.namespace }}
      kubectl delete pod lf-probe --namespace={{ langfuse.namespace }} --wait=false >/dev/null
    executable: /bin/bash          # pipefail
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _lf_probe
  # Retried while either path is not yet answering 200; an exhausted until:
  # does not fail here (failed_when: false), the assert below decides.
  until: "_lf_probe.rc == 0 and 'health: 200' in _lf_probe.stdout and (not _lf_present or 'nlb: 200' in _lf_probe.stdout)"
  retries: 6
  delay: 20
  failed_when: false
  changed_when: false
  check_mode: false

- name: Langfuse must answer through its Service
  ansible.builtin.assert:
    that: "_lf_probe.rc == 0 and 'health: 200' in _lf_probe.stdout"
    fail_msg: "GET http://{{ _lf_web_svc }}:3000/api/public/health did not return 200: {{ (_lf_probe.stdout_lines + _lf_probe.stderr_lines) | join(' | ') }}"
    success_msg: "GET http://{{ _lf_web_svc }}:3000/api/public/health -> 200"

- name: Note how the NLB path did
  ansible.builtin.set_fact:
    _lf_nlb_note: >-
      {{ 'answers 200 from inside the VPC'
         if 'nlb: 200' in _lf_probe.stdout
         else 'not confirmed from inside the cluster after ' ~ (_lf_probe.attempts | default(1)) ~ ' tries ('
              ~ (_lf_probe.stdout_lines | select('match', '^nlb:') | first | default('nlb: no answer'))
              ~ ') -- the hairpin from a node that also runs a web pod, the NLB still settling, or a langfuse.url the pod network cannot resolve; try from your VPN or a bastion' }}
  when: _lf_present

# --- report -------------------------------------------------------------------

- name: Report
  ansible.builtin.debug:
    msg:
      - "url:        {{ _lf_url }}"
      - "exposure:   {{ ('no load balancer -- kubectl port-forward -n ' ~ langfuse.namespace ~ ' svc/' ~ _lf_web_svc ~ ' 3000:3000, then open ' ~ _lf_url)
                        if not _lf_present else
                        (langfuse.load_balancer.type ~ ' NLB ' ~ _lf_host ~ ', allowed from ' ~ (_lf_sources | join(', ')) ~ '; '
                         ~ (_lf_lb_health.results | map(attribute='stdout') | map('trim') | join('/')) ~ ' healthy target(s); ' ~ _lf_nlb_note) }}"
      - "login:      {{ langfuse.init.user_email }} -- password in {{ langfuse_state_files.init_user_password_file | realpath }}"
      - "api keys:   {{ langfuse_state_files.public_key_file | realpath }} (public), {{ langfuse_state_files.secret_key_file | realpath }} (secret) -- project {{ langfuse.init.project_id }}"
      - "clickhouse: database {{ langfuse.clickhouse_database }} at c-{{ clickhouse.cluster_name }}-server-any.{{ clickhouse.namespace }}.svc:8123 as {{ langfuse.clickhouse_user }}, {{ _lf_ch_tables.stdout_lines | length }} tables, cluster mode {{ 'on' if _lf_cluster_enabled | bool else 'off' }}"
      - "smoke test: scripts/langfuse-smoke.sh   (posts a trace and reads it back from ClickHouse)"
      - "teardown:   ansible-playbook deploy.yml --tags lf-app -e langfuse_state=absent   (keeps the ClickHouse data; --tags lf-db -e langfuse_db_state=absent purges it)"
